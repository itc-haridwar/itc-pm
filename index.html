<!DOCTYPE html>
<html lang="en" data-fx="index">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITC Haridwar COT PM Module · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0e1a; --bg-panel:#111729; --bg-panel-2:#161e35;
  --border:#1f2a44; --border-bright:#2d3d65;
  --text:#e8ecf3; --text-dim:#8b96b1; --text-muted:#5b6584;
  --accent:#00d9ff; --accent-2:#ffb000; --accent-3:#ff3b6b; --accent-4:#7cf28b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-deep);color:var(--text);min-height:100vh}
body{
  background:
    radial-gradient(ellipse at top left, rgba(0,217,255,0.08), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(255,176,0,0.05), transparent 55%),
    radial-gradient(ellipse at center, rgba(124,242,139,0.03), transparent 70%),
    var(--bg-deep);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.shell{
  width:100%;max-width:420px;background:var(--bg-panel);
  border:1px solid var(--border);border-radius:12px;
  padding:40px;position:relative;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.shell::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2),var(--accent-4));
}
.brand{text-align:center;margin-bottom:32px}
.brand-logo{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;line-height:1}
.brand-logo span{color:var(--accent)}
.brand-sub{font-size:10px;letter-spacing:3.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600;margin-top:8px}
h1{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;text-align:center;margin-bottom:8px;font-weight:400}
.subtitle{text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:6px}
.field input{
  width:100%;background:var(--bg-panel-2);border:1px solid var(--border-bright);
  color:var(--text);padding:12px 14px;border-radius:6px;font-size:14px;font-family:inherit;outline:none;
  transition:all 0.15s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,217,255,0.15)}
.btn{
  width:100%;background:var(--accent);color:#0a0e1a;border:none;padding:13px;
  border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;transition:all 0.15s;margin-top:8px;
}
.btn:hover{background:#fff;transform:translateY(-1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn.secondary{background:transparent;color:var(--text-dim);border:1px solid var(--border-bright);margin-top:12px}
.btn.secondary:hover{border-color:var(--accent);color:var(--accent);background:transparent;transform:none}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.error{
  color:var(--accent-3);font-size:12px;margin-top:12px;padding:10px 12px;
  background:rgba(255,59,107,0.08);border:1px solid rgba(255,59,107,0.3);border-radius:5px;display:none;
}
.error.show{display:block}
.success{
  color:var(--accent-4);font-size:12px;margin-top:12px;padding:10px 12px;
  background:rgba(124,242,139,0.08);border:1px solid rgba(124,242,139,0.3);border-radius:5px;display:none;
}
.success.show{display:block}
.foot{text-align:center;margin-top:24px;font-size:11px;color:var(--text-muted)}
.foot a{color:var(--accent);text-decoration:none;cursor:pointer}
.foot a:hover{text-decoration:underline}

.toggle-link{text-align:center;margin-top:14px;font-size:12px;color:var(--text-dim)}
.toggle-link a{color:var(--accent);text-decoration:none;cursor:pointer;font-weight:600}
.toggle-link a:hover{text-decoration:underline}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,14,26,0.3);border-top-color:#0a0e1a;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<style id="fx318-css">
/* ═══ 3.18 · Visual layer — 3D maintenance scene, glass, lights and morph transitions ═══
   Purely visual. Every rule is behind html.fx-on, so "✦ Effects off" (or a failed script) shows the
   original 3.16 look. No data, ids, text or logic are touched. */
html[data-fx]{
  --fx-a:#00d9ff; --fx-b:#a78bfa; --fx-c:#ffb000; --fx-ok:#7cf28b; --fx-bad:#ff3b6b; --fx-warn:#ffb000;
  --fx-deep:#070b16; --fx-glass:rgba(16,22,40,.58); --fx-glass-2:rgba(22,30,54,.62); --fx-glass-3:rgba(10,14,28,.78);
  --fx-edge:rgba(255,255,255,.085); --fx-edge-2:rgba(255,255,255,.16); --fx-r:14px; --fx-blur:16px;
  --fx-ease:cubic-bezier(.2,.9,.25,1); --fx-spring:cubic-bezier(.3,1.35,.45,1);
}
html[data-fx=panel],html[data-fx=complaint]{--fx-a:#fb923c; --fx-b:#60a5fa; --fx-c:#a78bfa; --fx-ok:#22c55e; --fx-bad:#ef4444; --fx-warn:#f59e0b;
  --fx-deep:#08080b; --fx-glass:rgba(22,22,28,.6); --fx-glass-2:rgba(30,30,38,.62); --fx-glass-3:rgba(14,14,18,.8)}
html[data-fx=aic]{--fx-a:#eab308; --fx-b:#60a5fa; --fx-c:#22c55e; --fx-ok:#22c55e; --fx-bad:#ef4444; --fx-warn:#f59e0b;
  --fx-deep:#08080b; --fx-glass:rgba(22,22,28,.6); --fx-glass-2:rgba(30,30,38,.62); --fx-glass-3:rgba(14,14,18,.8)}
html[data-fx=passport]{--fx-a:#34d399; --fx-b:#60a5fa; --fx-c:#a78bfa; --fx-ok:#22c55e; --fx-bad:#ef4444; --fx-warn:#f59e0b;
  --fx-deep:#08080b; --fx-glass:rgba(22,22,28,.6); --fx-glass-2:rgba(30,30,38,.62); --fx-glass-3:rgba(14,14,18,.8)}

@property --fx-pp{syntax:'<number>';inherits:true;initial-value:0}

/* ── Ambient lights (fixed layer behind everything) ── */
#fx-bg{display:none}
html.fx-on #fx-bg{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:strict}
html.fx-on #fx-bg i{position:absolute;border-radius:50%;will-change:transform;opacity:.6}
html.fx-on #fx-bg i:nth-of-type(1){width:70vmax;height:70vmax;left:-24vmax;top:-30vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--fx-a) 34%,transparent),transparent 72%);animation:fx-drift1 26s ease-in-out infinite alternate}
html.fx-on #fx-bg i:nth-of-type(2){width:62vmax;height:62vmax;right:-26vmax;top:18vh;background:radial-gradient(closest-side,color-mix(in srgb,var(--fx-b) 26%,transparent),transparent 72%);animation:fx-drift2 32s ease-in-out infinite alternate}
html.fx-on #fx-bg i:nth-of-type(3){width:56vmax;height:56vmax;left:12vw;bottom:-34vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--fx-c) 20%,transparent),transparent 72%);animation:fx-drift3 38s ease-in-out infinite alternate}
html.fx-on #fx-bg b{position:absolute;inset:-2px;background-image:linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 10%,transparent 75%)}
html.fx-on #fx-bg u{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--fx-a) 70%,transparent),transparent);opacity:.35;animation:fx-scan 9s linear infinite}
@keyframes fx-drift1{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(16vw,12vh,0) scale(1.18)}}
@keyframes fx-drift2{0%{transform:translate3d(0,0,0) scale(1.05)}100%{transform:translate3d(-14vw,-10vh,0) scale(.9)}}
@keyframes fx-drift3{0%{transform:translate3d(0,0,0) scale(.95)}100%{transform:translate3d(10vw,-14vh,0) scale(1.15)}}
@keyframes fx-scan{0%{transform:translateY(-10px);opacity:0}8%{opacity:.55}100%{transform:translateY(100vh);opacity:0}}
html.fx-on,html.fx-on body{background:var(--fx-deep) !important}
html.fx-on body{background:transparent !important}

/* ── Glass surfaces (shared recipe) ── */
html.fx-on :is(.card,.kpi-strip,.filters,.x13-card,.fy-tag,.month-card,.action-tile,.fx-insight,.notify-banner,details.ed-audit,.signed-tile,.rep-box,.acard,.plate){
  background:
    linear-gradient(115deg,transparent 42%,rgba(255,255,255,.07) 50%,transparent 58%) 160% 0/260% 100% no-repeat,
    radial-gradient(420px circle at var(--fx-mx,50%) var(--fx-my,-40%),rgba(255,255,255,.07),transparent 60%),
    linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.01) 38%,rgba(255,255,255,.025)),
    var(--fx-glass) !important;
  -webkit-backdrop-filter:blur(var(--fx-blur)) saturate(150%);backdrop-filter:blur(var(--fx-blur)) saturate(150%);
  border-color:var(--fx-edge) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.3),0 18px 40px -24px rgba(0,0,0,.85),0 2px 10px -4px rgba(0,0,0,.4);
  transition:border-color .25s,box-shadow .3s,transform .25s var(--fx-ease)}
html.fx-on :is(.card,.x13-card,.kpi-strip,.fx-insight,.acard){border-radius:var(--fx-r)}
html.fx-on :is(.card,.x13-card,.month-card,.action-tile,.fx-insight,.acard):hover{border-color:color-mix(in srgb,var(--fx-a) 38%,var(--fx-edge)) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 0 0 1px color-mix(in srgb,var(--fx-a) 14%,transparent),0 22px 48px -26px color-mix(in srgb,var(--fx-a) 45%,#000),0 2px 10px -4px rgba(0,0,0,.4)}
/* KPI tiles: glass + light stripe + glowing figure */
html.fx-on .kpi{background:
    radial-gradient(260px circle at var(--fx-mx,50%) var(--fx-my,-60%),rgba(255,255,255,.08),transparent 60%),
    linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.01) 45%),var(--fx-glass) !important;
  -webkit-backdrop-filter:blur(var(--fx-blur)) saturate(150%);backdrop-filter:blur(var(--fx-blur)) saturate(150%);
  border-color:var(--fx-edge) !important;border-radius:12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -22px rgba(0,0,0,.9);
  transition:transform .25s var(--fx-ease),box-shadow .3s,border-color .25s;transform-style:preserve-3d}
html.fx-on .kpi-strip .kpi{background:radial-gradient(240px circle at var(--fx-mx,50%) var(--fx-my,-60%),rgba(255,255,255,.07),transparent 60%) !important;
  -webkit-backdrop-filter:none;backdrop-filter:none;border-radius:0;box-shadow:none;border-color:rgba(255,255,255,.06) !important}
html.fx-on :is(.kpi-value,.kpi .v,.x13-kpi b,.dn-kpi b){text-shadow:0 0 18px color-mix(in srgb,currentColor 45%,transparent),0 0 2px color-mix(in srgb,currentColor 30%,transparent)}
html.fx-on .kpi:hover{border-color:color-mix(in srgb,var(--fx-a) 40%,var(--fx-edge)) !important;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 26px -10px color-mix(in srgb,var(--fx-a) 55%,transparent),0 18px 40px -22px rgba(0,0,0,.9)}
/* 3D tilt (pointer devices only; vars set by the script) */
@media (hover:hover) and (pointer:fine){
  html.fx-on:not(.fx-still) :is(.kpi,.month-card,.action-tile,.sys,.x13-kpi,.dn-kpi,.shell).fx-tilt{transform:perspective(700px) rotateX(var(--fx-rx,0deg)) rotateY(var(--fx-ry,0deg)) translate3d(0,-3px,0) !important;transition:transform .12s linear,box-shadow .3s,border-color .25s}
}
/* KPI ring gauge for % figures */
html.fx-on .kpi.fx-ring{position:relative}
html.fx-on .kpi.fx-ring::after{content:'';position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,var(--fx-glass-3) 70%,transparent 72%),conic-gradient(from -90deg,var(--fx-rc,var(--fx-a)) calc(var(--fx-pp)*1%),rgba(255,255,255,.08) 0);
  filter:drop-shadow(0 0 8px color-mix(in srgb,var(--fx-rc,var(--fx-a)) 50%,transparent));animation:fx-ring 1.4s var(--fx-ease) .2s both}
@keyframes fx-ring{from{--fx-pp:0}to{--fx-pp:var(--fx-pct,0)}}
html.fx-on .kpi.fx-ring{--fx-pp:var(--fx-pct,0)}

/* ── Headers, sidebars, top bars: frosted ── */
html.fx-on :is(.app-header,.tabbar,.topbar,.app-head){background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),var(--fx-glass-3) !important;
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-color:var(--fx-edge) !important}
html.fx-on .sidebar{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01) 30%,rgba(255,255,255,.02)),var(--fx-glass-3) !important;
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border-color:var(--fx-edge) !important;box-shadow:1px 0 0 rgba(255,255,255,.03),10px 0 40px -30px #000}
html.fx-on :is(.app-header,.topbar,.app-head)::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent 5%,color-mix(in srgb,var(--fx-a) 75%,transparent) 30%,color-mix(in srgb,var(--fx-b) 70%,transparent) 60%,transparent 95%);background-size:200% 100%;animation:fx-flow 7s linear infinite;opacity:.8}
html.fx-on .app-header{position:relative}
@keyframes fx-flow{to{background-position:-200% 0}}
html.fx-on :is(.brand-logo span,.page-title span){background:linear-gradient(90deg,var(--fx-a),var(--fx-b),var(--fx-a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent !important;animation:fx-flow 6s linear infinite;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--fx-a) 40%,transparent))}
html.fx-on :is(.mod-title,.page-title,.topbar-title h1){text-shadow:0 0 22px color-mix(in srgb,var(--fx-a) 22%,transparent)}
html.fx-on .main{background:transparent !important}
html.fx-on #motor-build::after,html.fx-on #aic-build::after,html.fx-on #pp-build::after,html.fx-on .fx-stamp::after{content:' · FX 3.18';color:var(--fx-a);opacity:.85}

/* ── Morphing tab indicator (one per tab group; positioned by the script) ── */
html.fx-on .fx-has-ind{position:relative}
html.fx-on .fx-has-ind > :not(.fx-ind){position:relative;z-index:1}
.fx-ind{display:none}
html.fx-on .fx-ind{display:block;position:absolute;z-index:0;pointer-events:none;left:0;top:0;width:0;height:0;opacity:0;border-radius:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--fx-a) 16%,transparent),color-mix(in srgb,var(--fx-a) 6%,transparent));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 1px color-mix(in srgb,var(--fx-a) 30%,transparent),0 0 22px -6px color-mix(in srgb,var(--fx-a) 60%,transparent);
  transition:left .5s var(--fx-spring),right .5s var(--fx-spring),top .5s var(--fx-spring),bottom .5s var(--fx-spring),width .5s var(--fx-spring),height .5s var(--fx-spring),opacity .25s}
html.fx-on .fx-ind::after{content:'';position:absolute;left:14%;right:14%;bottom:-1px;height:2px;border-radius:2px;background:var(--fx-a);box-shadow:0 0 10px var(--fx-a),0 0 22px var(--fx-a)}
html.fx-on .fx-ind.fx-v::after{left:-1px;right:auto;top:18%;bottom:18%;width:2px;height:auto}
html.fx-on .fx-ind.fx-fill{border-radius:0;background:var(--fx-a);box-shadow:0 0 18px -2px var(--fx-a)}
html.fx-on .fx-ind.fx-fill::after{display:none}
html.fx-on .fx-ind.fx-noanim{transition:none}
html.fx-on .fx-has-ind > :is(.tab,.subtab,button).active,html.fx-on .fx-has-ind > button.on{border-bottom-color:transparent !important}
html.fx-on .fx-has-ind > .nav-item.active{background:transparent !important;border-left-color:transparent !important;border-bottom-color:transparent !important}
html.fx-on .fx-has-ind > :is(.tab,.subtab,.nav-item).active,html.fx-on .fx-has-ind > button.on{text-shadow:0 0 14px color-mix(in srgb,var(--fx-a) 55%,transparent)}
html.fx-on .mseg.fx-has-ind > button.on{background:transparent !important}
html.fx-on .fx-has-ind > :is(.tab,.subtab,.nav-item,button){transition:color .3s,text-shadow .3s,transform .2s var(--fx-ease)}
html.fx-on .fx-has-ind > :is(.tab,.subtab,.nav-item,button):active{transform:scale(.96)}

/* ── Morph transitions: pages, sub-sections, views, app tabs ── */
html.fx-on .fx-enter{animation:fx-morph .55s var(--fx-ease) both;transform-origin:50% 0}
@keyframes fx-morph{0%{opacity:0;transform:translate3d(0,22px,0) scale(.985)}100%{opacity:1;transform:none}}
html.fx-on .fx-enter .fx-cas{animation:fx-rise .62s var(--fx-ease) both;animation-delay:calc(min(var(--fx-i,0),14) * 40ms + 60ms)}
html.fx-on .fx-enter :is(.card,.x13-card,.fx-insight,.acard,.month-card,.action-tile,.filters).fx-cas{animation:fx-rise .62s var(--fx-ease) both,fx-sweep 1.3s ease-out both;animation-delay:calc(min(var(--fx-i,0),14) * 40ms + 60ms),calc(min(var(--fx-i,0),14) * 40ms + 240ms)}
@keyframes fx-rise{0%{opacity:0;transform:perspective(900px) translate3d(0,34px,-90px) rotateX(18deg)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes fx-sweep{0%{background-position:160% 0,0 0,0 0,0 0}100%{background-position:-60% 0,0 0,0 0,0 0}}
html.fx-on .tab-content{perspective:1600px}
html.fx-on .tab-pane.active{animation:fx-pane .55s var(--fx-ease) both;transform-origin:calc(50% + var(--fx-dir,0) * -50%) 50%}
@keyframes fx-pane{0%{opacity:0;transform:translate3d(calc(var(--fx-dir,0) * 40px),10px,-80px) rotateY(calc(var(--fx-dir,0) * -9deg)) scale(.97)}100%{opacity:1;transform:none}}
html.fx-on details:is(.x13-card,.ed-audit)[open] > :not(summary){animation:fx-unfold .42s var(--fx-ease) both}
@keyframes fx-unfold{0%{opacity:0;transform:translateY(-8px) scaleY(.97);transform-origin:top}100%{opacity:1;transform:none}}
/* motor's own fade-in on .page is kept for the no-FX look; FX uses the morph above */
html.fx-on .page.active.fx-enter{animation:fx-morph .55s var(--fx-ease) both}

/* ── Modals: glass sheet that pops forward in 3D ── */
html.fx-on :is(#modal-backdrop,#m-bd,#cx-bd,#modal-bd).show{-webkit-backdrop-filter:blur(7px) saturate(120%);backdrop-filter:blur(7px) saturate(120%);background:rgba(3,5,12,.58) !important;animation:fx-fade .3s ease both}
html.fx-on :is(#modal-host,#m-host,#cx-host).show{background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 40%),var(--fx-glass-3) !important;
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);border:1px solid var(--fx-edge-2) !important;border-radius:16px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(0,0,0,.3),0 30px 80px -20px rgba(0,0,0,.85),0 0 60px -30px color-mix(in srgb,var(--fx-a) 60%,transparent);
  animation:fx-modal .46s var(--fx-spring) backwards}
@keyframes fx-modal{0%{opacity:0;transform:translate(-50%,-50%) perspective(1000px) translate3d(0,40px,-120px) rotateX(14deg) scale(.94)}100%{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fx-fade{from{opacity:0}to{opacity:1}}
html.fx-on :is(.modal-head,.modal-footer,.modal-foot,.cx-head,.cx-foot){background:rgba(255,255,255,.03) !important;border-color:var(--fx-edge) !important}

/* ── Toasts ── */
html.fx-on :is(.toast,#toast-wrap .toast,.toast-wrap .toast){background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02)),var(--fx-glass-3) !important;

  </div>

    <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="you@itc.in" autocomplete="email"></div>

    <button class="btn" id="signup-btn" onclick="doSignUp()">Create Account</button>
    <div class="error" id="signup-error"></div>
    <div class="success" id="signup-success"></div>
    <div class="toggle-link">Already have an account? <a onclick="toggleForm('signin')">Sign in</a></div>
  </div>

</div>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// If already signed in, go to app
onAuthStateChanged(auth, (user) => {
  if(user) window.location.href = './app.html';
});

window.toggleForm = (which) => {
  document.getElementById('signin-form').style.display = which==='signin' ? 'block':'none';
  document.getElementById('signup-form').style.display = which==='signup' ? 'block':'none';
  document.querySelectorAll('.error,.success').forEach(e=>e.classList.remove('show'));
};

function showErr(id, msg){
  const e = document.getElementById(id);
  e.textContent = msg; e.classList.add('show');
}
function showOk(id, msg){
  const e = document.getElementById(id);
  e.textContent = msg; e.classList.add('show');
}
function setBtnLoading(btnId, on, label){
  const b = document.getElementById(btnId);
  if(on){ b.disabled = true; b.innerHTML = '<span class="spinner"></span>'+(label||'Working…'); }
  else { b.disabled = false; b.textContent = label; }
}

window.doSignIn = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const errEl = document.getElementById('signin-error');
  errEl.classList.remove('show');
  if(!email || !pass){ showErr('signin-error','Email and password required'); return; }
  setBtnLoading('signin-btn', true, 'Signing in…');
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = './app.html';
  } catch(e){
    setBtnLoading('signin-btn', false, 'Sign In');
    const msg = e.code === 'auth/invalid-credential' ? 'Invalid email or password' :
                e.code === 'auth/user-not-found' ? 'No account with this email' :
                e.code === 'auth/wrong-password' ? 'Incorrect password' :
                e.code === 'auth/too-many-requests' ? 'Too many attempts. Try again later.' :
                e.message;
    showErr('signin-error', msg);
  }
};

window.doSignUp = async () => {
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const pass  = document.getElementById('signup-password').value;
  document.getElementById('signup-error').classList.remove('show');
  document.getElementById('signup-success').classList.remove('show');
  if(!name || !email || !pass){ showErr('signup-error','All fields required'); return; }
  if(pass.length < 6){ showErr('signup-error','Password must be at least 6 characters'); return; }
  setBtnLoading('signup-btn', true, 'Creating…');
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    if(name) await updateProfile(cred.user, {displayName: name});
    showOk('signup-success', 'Account created! Redirecting…');
    setTimeout(()=>{ window.location.href = './app.html'; }, 800);
  } catch(e){
    setBtnLoading('signup-btn', false, 'Create Account');
    const msg = e.code === 'auth/email-already-in-use' ? 'That email is already registered' :
                e.code === 'auth/invalid-email' ? 'Invalid email format' :
                e.code === 'auth/weak-password' ? 'Password too weak' :
                e.message;
    showErr('signup-error', msg);
  }
};

window.doReset = async () => {
  const email = document.getElementById('login-email').value.trim();
  if(!email){ showErr('signin-error','Enter your email above first'); return; }
  try{
    await sendPasswordResetEmail(auth, email);
    showOk('signup-success', 'Password reset email sent (check inbox).');
    document.getElementById('signup-success').style.display = 'block';
    document.getElementById('signup-success').classList.add('show');
    document.getElementById('signin-error').classList.remove('show');
  } catch(e){ showErr('signin-error', e.message); }
};

// Submit on Enter key
document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doSignIn(); });
document.getElementById('signup-password').addEventListener('keydown', e=>{ if(e.key==='Enter') doSignUp(); });
</script>

  var passportGraphs = safe(function(){
    var tiles = D.querySelectorAll('.sys-grid .sys');
    if(tiles.length){
      var vals = [].map.call(tiles, function(t){ var c = t.querySelector('.ct'); return c ? (parseFloat((c.textContent || '').replace(/[^\d.]/g, '')) || 0) : 0; });
      var mx = Math.max.apply(null, [1].concat(vals));
      [].forEach.call(tiles, function(t, i){ var p = (vals[i] / mx).toFixed(3); if(t.style.getPropertyValue('--fx-p') !== p) t.style.setProperty('--fx-p', p); });
    }
    var host = D.getElementById('view-reports'); if(!host) return;
    var items = [];
    try{ items = (typeof allItems === 'function') ? allItems() : []; }catch(e){ items = []; }
    var bySys = {}, byUnit = {}, photos = 0;
    items.forEach(function(i){
      var k = 'General'; try{ k = (typeof systemOf === 'function') ? systemOf(i.area) : 'General'; }catch(e){}
      bySys[k] = (bySys[k] || 0) + 1;
      var u = i.unit || '—'; byUnit[u] = (byUnit[u] || 0) + 1;
      if(i.photo || (Array.isArray(i.photos) && i.photos.length) || i.photoId || i.img) photos++;
    });
    var rows = Object.keys(bySys).map(function(k){
      var ic = ''; try{ ic = (typeof sysDef === 'function') ? (sysDef(k).ic || '') : ''; }catch(e){}
      return { l: (ic ? ic + ' ' : '') + k, n: k, v: bySys[k] };
    }).sort(function(a, b){ return b.v - a.v; });
    var sig = JSON.stringify([rows, byUnit]);
    var el = D.getElementById('fx-fp');
    if(el && el.parentNode === host && sig === fpSig) return;
    fpSig = sig;
    el = insight('fx-fp', '📊 Equipment picture', items.length + ' items');
    if(el.parentNode !== host) host.insertBefore(el, host.firstChild);
    var PAL = [cssVar('--fx-a', '#34d399'), '#60a5fa', '#a78bfa', '#f59e0b', '#f472b6', '#22d3ee', '#facc15', '#fb923c', '#4ade80', '#818cf8', '#94a3b8'];
    var top = rows.slice(0, 7), rest = rows.slice(7).reduce(function(s, r){ return s + r.v; }, 0);
    var segs = top.map(function(r, i){ return { l: r.n, v: r.v, c: PAL[i % PAL.length] }; });
    if(rest) segs.push({ l: 'Other', v: rest, c: PAL[10] });
    var uName = function(u){ return u === 'P1-COT' ? 'Ph-1 · COT' : u === 'P2-PPB' ? 'Ph-2 · PPB' : u; };
    var units = Object.keys(byUnit).sort().map(function(u, i){ return { l: uName(u), v: byUnit[u], c: [PAL[0], PAL[1], PAL[2], PAL[3]][i % 4] }; });
    el.querySelector('.fx-ins-b').innerHTML = items.length ? (
      '<div class="fx-g"><div class="fx-g-t">Share by system</div>' + donut(segs, items.length, 'items') + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">Count by system</div>' + bars(rows.slice(0, 9).map(function(r){ return { l: r.l, vs: [r.v] }; }), [{ l: 'Items', c: PAL[0] }]) + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">By phase</div>' + donut(units, units.length ? Math.round(units.reduce(function(m, u){ return Math.max(m, u.v); }, 0) / items.length * 100) + '%' : '—', units.length ? units.slice().sort(function(x, y){ return y.v - x.v; })[0].l : '') + '</div>'
    ) : '<div class="fx-empty">Graphs appear once equipment is loaded.</div>';
  });

  /* ── 9 · app shell: switch, orbit mark, tab direction for the 3D page turn ── */
  function mode(){ var m = store('pmfx'); return m === 'off' ? 'off' : m === 'lite' ? 'lite' : '3d'; }
  var LBL = { '3d': ['FX 3D', '3D', 'Effects: full 3D (3.18) — tap for Lite on a slow phone'], lite: ['FX LITE', 'LITE', 'Effects: Lite — glass and light, no 3D scene. Tap to switch effects off'], off: ['FX OFF', 'OFF', 'Effects off — plain look. Tap for full 3D'] };
  function apply(){
    var m = mode(), on = m !== 'off';
    H.classList.toggle('fx-on', on);
    var S = W.__fxScene, want3d = m === '3d';
    if(want3d && S && !S.ok() && !H.__fxTried){ H.__fxTried = 1; S.init(); }
    var has3d = want3d && !!(S && S.ok());
    H.classList.toggle('fx-3d', has3d);
    try{ if(S){ if(has3d) S.start(); else S.stop(); } }catch(e){ warn(e); }
    var sw = D.querySelector('.fx-sw'); if(sw){ var L = LBL[m]; sw.setAttribute('data-m', m); sw.querySelector('.t').textContent = L[0]; sw.querySelector('.t2').textContent = L[1]; sw.title = L[2]; sw.setAttribute('aria-label', L[2]); }
    chartsRefresh(); schedule();
    try{ [].forEach.call(D.querySelectorAll('iframe'), function(f){ try{ if(f.contentWindow && f.contentWindow.__fx) f.contentWindow.__fx.apply(); }catch(e){} }); }catch(e){}
  }
  var appShell = safe(function(){
    if(MOD !== 'app') return;
    var ub = D.querySelector('.user-block'), so = ub && ub.querySelector('.signout-btn');
    if(ub && !ub.querySelector('.fx-sw')){
      var b = D.createElement('button'); b.type = 'button'; b.className = 'fx-sw';
      b.innerHTML = '<span class="d"></span><span class="t">FX 3D</span><span class="t2">3D</span>';
      b.addEventListener('click', safe(function(){ var m = mode(); store('pmfx', m === '3d' ? 'lite' : m === 'lite' ? 'off' : 'on'); apply(); }));
      ub.insertBefore(b, so || null);
    }
    var br = D.querySelector('.app-header .brand');
    if(br && !br.querySelector('.fx-orbit')){ var o = D.createElement('span'); o.className = 'fx-orbit'; o.setAttribute('aria-hidden', 'true'); o.innerHTML = '<i></i><i></i><i></i>'; br.insertBefore(o, br.firstChild); }
    var tabs = [].slice.call(D.querySelectorAll('.tabbar .tab')), tc = D.querySelector('.tab-content');
    D.addEventListener('click', safe(function(e){
      var t = e.target && e.target.closest && e.target.closest('.tabbar .tab'); if(!t || !tc) return;
      var cur = D.querySelector('.tabbar .tab.active');
      var dir = Math.sign(tabs.indexOf(t) - tabs.indexOf(cur)) || 0;
      tc.style.setProperty('--fx-dir', dir);
      try{ if(W.__fxScene) W.__fxScene.page(t.getAttribute('data-tab')); }catch(err){ warn(err); }
    }), true);
    apply();
  });
  var indexPage = safe(function(){
    if(MOD !== 'index') return;
    var br = D.querySelector('.brand');
    if(br && !D.querySelector('.fx-gyro')){
      var g = D.createElement('div'); g.className = 'fx-gyro'; g.setAttribute('aria-hidden', 'true');
      g.innerHTML = '<i></i><i></i><i></i><b></b>';
      br.insertBefore(g, br.firstChild);
    }
  });

  /* ── scheduler: one pass per frame after any change on the page ── */
  var pend = 0;
  var pass = safe(function(){
    pend = 0;
    syncTabs(); syncPanes(); syncKpi(); syncFixed();
    if(MOD === 'complaint') complaintGraphs();
    if(MOD === 'aic') aicGraphs();
    if(MOD === 'passport') passportGraphs();
  });
  function schedule(){ if(!pend) pend = requestAnimationFrame(pass); }

  W.__fx = { apply: safe(apply), refresh: schedule, build: W.__fxBuild };
  var boot = safe(function(){
    lights(); chartTheme(); appShell(); indexPage(); bindPointer();
    if(MOD !== 'app') apply();
    try{ new MutationObserver(function(){ schedule(); }).observe(D.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'hidden'] }); }catch(e){ warn(e); }
    W.addEventListener('resize', schedule, { passive: true });
    W.addEventListener('storage', function(e){ if(e.key === 'pmfx') apply(); });
    try{ if(D.fonts && D.fonts.ready) D.fonts.ready.then(function(){ D.querySelectorAll('.fx-has-ind').forEach(function(c){ c.__fxR = null; }); schedule(); }); }catch(e){}
    setInterval(function(){ if(!D.hidden) schedule(); }, 2500);
    schedule();
  });
  if(D.readyState === 'loading') D.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
