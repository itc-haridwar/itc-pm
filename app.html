<!DOCTYPE html>
<html lang="en" data-fx="app">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITC Haridwar COT PM Module</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0e1a; --bg-panel:#111729; --bg-panel-2:#161e35;
  --border:#1f2a44; --border-bright:#2d3d65;
  --text:#e8ecf3; --text-dim:#8b96b1; --text-muted:#5b6584;
  --accent:#00d9ff; --accent-2:#ffb000; --accent-3:#ff3b6b; --accent-4:#7cf28b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Inter',system-ui,sans-serif;background:var(--bg-deep);color:var(--text);height:100vh;overflow:hidden}

.app-shell{display:flex;flex-direction:column;height:100vh}

/* Top header */
.app-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;background:var(--bg-panel);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;line-height:1}
.brand-logo span{color:var(--accent)}
.brand-sub{font-size:9px;letter-spacing:2.5px;color:var(--text-muted);text-transform:uppercase;font-weight:600}
.user-block{display:flex;align-items:center;gap:14px;font-size:12px}
.user-name{color:var(--text-dim)}
.user-name b{color:var(--text)}
.signout-btn{
  background:transparent;border:1px solid var(--border-bright);color:var(--text-dim);
  padding:6px 14px;border-radius:4px;font-size:11px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all 0.15s;
}
.signout-btn:hover{border-color:var(--accent-3);color:var(--accent-3)}

/* Tab bar */
.tabbar{
  display:flex;background:var(--bg-panel);border-bottom:1px solid var(--border);
  padding:0 24px;flex-shrink:0;
}
.tab{
  padding:14px 24px;cursor:pointer;color:var(--text-dim);font-size:12px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;border-bottom:2px solid transparent;
  transition:all 0.15s;display:flex;align-items:center;gap:8px;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab.locked{opacity:0.55;cursor:not-allowed}
.tab-icon{font-size:14px}
.tab-badge{
  background:var(--bg-panel-2);color:var(--text-muted);font-size:9px;letter-spacing:1px;
  padding:2px 6px;border-radius:3px;border:1px solid var(--border-bright);font-weight:700;
}
.tab.active .tab-badge{background:rgba(0,217,255,0.1);color:var(--accent);border-color:var(--accent)}

/* Tab content */
.tab-content{flex:1;overflow:hidden;position:relative}
.tab-pane{display:none;height:100%;width:100%}
.tab-pane.active{display:block}

iframe{width:100%;height:100%;border:none;background:var(--bg-deep)}

/* Panel PM placeholder */
.placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;padding:40px;text-align:center;
  background:
    radial-gradient(ellipse at top left, rgba(255,176,0,0.06), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(0,217,255,0.04), transparent 50%),
    var(--bg-deep);
}
.placeholder-icon{font-size:64px;color:var(--accent-2);margin-bottom:24px;opacity:0.6}
.placeholder h2{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:3px;margin-bottom:12px}
.placeholder .subtitle{font-size:14px;color:var(--text-dim);max-width:560px;line-height:1.6;margin-bottom:32px}
.placeholder .checklist{
  background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;
  padding:24px 32px;text-align:left;max-width:480px;width:100%;
}
.placeholder .checklist h3{font-size:11px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:14px}
.placeholder .checklist ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.placeholder .checklist li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text-dim)}
.placeholder .checklist li::before{content:"○";color:var(--accent-2);font-size:16px;line-height:1.2}

/* Loading */
.loader{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg-deep);z-index:5;
}
.loader.hide{display:none}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width: 640px){
  .app-header{padding:10px 14px;flex-wrap:wrap;gap:8px}
  .tabbar{padding:0 8px;overflow-x:auto}
  .tab{padding:12px 16px}
  .user-name{display:none}
}

/* ═══ 3.12 · Global search ═══ */
.gs-open{flex:1;max-width:460px;margin:0 18px;display:flex;align-items:center;gap:10px;background:var(--bg-panel-2);border:1px solid var(--border-bright);color:var(--text-dim);border-radius:8px;padding:8px 12px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left;min-width:0}
.gs-open:hover,.gs-open:focus-visible{border-color:var(--accent);color:var(--text);outline:none}
.gs-open .gs-ph{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-open kbd,.gs-kbd{font-family:'JetBrains Mono',monospace;font-size:10px;border:1px solid var(--border-bright);border-radius:4px;padding:1px 6px;color:var(--text-muted)}
.gs-ico{font-size:14px;line-height:1}

.gs{position:fixed;inset:0;z-index:50;background:rgba(4,7,14,.72);display:flex;justify-content:center;align-items:flex-start;padding:6vh 16px 16px}
.gs[hidden]{display:none}
.gs-panel{width:100%;max-width:780px;max-height:88vh;display:flex;flex-direction:column;background:var(--bg-panel);border:1px solid var(--border-bright);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden}
.gs-top{display:flex;gap:10px;align-items:center;padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.gs-box{flex:1;display:flex;align-items:center;gap:10px;background:var(--bg-deep);border:1px solid var(--accent);border-radius:8px;padding:0 10px;min-width:0}
.gs-box input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font:inherit;font-size:16px;padding:11px 0}
.gs-box input::-webkit-search-cancel-button{display:none}
.gs-x{background:none;border:0;color:var(--text-muted);font-size:15px;cursor:pointer;padding:6px}
.gs-x:hover{color:var(--text)}
.gs-close{background:transparent;border:1px solid var(--border-bright);color:var(--text-dim);border-radius:6px;padding:9px 12px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.gs-close:hover{color:var(--text);border-color:var(--text-dim)}
.gs-scopes{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.gs-scopes::-webkit-scrollbar{display:none}
.gs-chip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--bg-panel-2);border:1px solid var(--border-bright);color:var(--text-dim);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.gs-chip:hover{color:var(--text)}
.gs-chip.on{background:rgba(0,217,255,.12);border-color:var(--accent);color:var(--accent)}
.gs-chip .n{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-muted)}
.gs-chip.on .n{color:var(--accent)}
.gs-chip.dim{opacity:.45}
.gs-status{padding:8px 14px;font-size:11px;color:var(--text-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0}
.gs-status b{color:var(--text-dim);font-weight:600}
.gs-status .gs-ref{background:none;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0 2px}
.gs-spin{display:inline-block;width:10px;height:10px;border:2px solid var(--border-bright);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
.gs-body{overflow-y:auto;padding:0 8px 14px;-webkit-overflow-scrolling:touch;flex:1}
.gs-note{margin:4px 6px 10px;padding:9px 12px;border:1px dashed var(--border-bright);border-radius:8px;font-size:12px;color:var(--text-dim)}
.gs-note b{color:var(--text)}
.gs-gh{display:flex;justify-content:space-between;align-items:center;padding:14px 8px 6px;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-muted);font-weight:700}
.gs-gh .c{font-family:'JetBrains Mono',monospace;letter-spacing:0}
.gs-item{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:9px 8px;color:var(--text);font:inherit;cursor:pointer}
.gs-item:hover,.gs-item.act{background:var(--bg-panel-2);border-color:var(--border-bright)}
.gs-item.act{border-color:var(--accent)}
.gs-kind{flex:none;width:74px;text-align:center;font-size:9px;letter-spacing:1px;font-weight:700;border-radius:4px;padding:4px 0;border:1px solid var(--border-bright);color:var(--text-dim);text-transform:uppercase}
.gs-kind.k-motor,.gs-kind.k-pm{color:var(--accent);border-color:rgba(0,217,255,.45)}
.gs-kind.k-panel,.gs-kind.k-punit{color:var(--accent-2);border-color:rgba(255,176,0,.45)}
.gs-kind.k-complaint,.gs-kind.k-carea{color:var(--accent-3);border-color:rgba(255,59,107,.45)}
.gs-kind.k-aicitem,.gs-kind.k-record,.gs-kind.k-activity{color:var(--accent-4);border-color:rgba(124,242,139,.45)}
.gs-kind.k-equip,.gs-kind.k-parea,.gs-kind.k-ptype{color:#c9a7ff;border-color:rgba(201,167,255,.45)}
.gs-main{flex:1;min-width:0}
.gs-t{display:block;font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gs-s{display:block;font-size:11.5px;color:var(--text-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-w{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px}
.gs-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:34%}
.gs-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-dim);white-space:nowrap}
.gs-go{color:var(--text-muted);font-size:18px;line-height:1;flex:none}
.gs mark{background:#FFD84D;color:#111;border-radius:2px;padding:0 1px}
.gs-pill{font-size:9px;letter-spacing:.8px;font-weight:700;border-radius:3px;padding:2px 6px;text-transform:uppercase;white-space:nowrap;border:1px solid var(--border-bright);color:var(--text-dim)}
.gs-pill.st-overdue,.gs-pill.st-notok,.gs-pill.st-open,.gs-pill.st-repair{color:#ff6b8f;border-color:rgba(255,59,107,.55);background:rgba(255,59,107,.1)}
.gs-pill.st-due,.gs-pill.st-norecord,.gs-pill.st-observation{color:#ffc24d;border-color:rgba(255,176,0,.55);background:rgba(255,176,0,.1)}
.gs-pill.st-upcoming,.gs-pill.st-standby{color:var(--accent);border-color:rgba(0,217,255,.5);background:rgba(0,217,255,.08)}
.gs-pill.st-done,.gs-pill.st-ok,.gs-pill.st-closed,.gs-pill.st-service{color:var(--accent-4);border-color:rgba(124,242,139,.5);background:rgba(124,242,139,.08)}
.gs-pill.st-admin{color:var(--text-muted)}
.gs-more{display:block;margin:4px 8px 0;background:none;border:0;color:var(--accent);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:6px 0}
.gs-top-hit{margin:10px 2px 2px;border:1px solid var(--accent);border-radius:10px;background:linear-gradient(135deg,rgba(0,217,255,.08),transparent 60%)}
.gs-top-hit .gs-item{padding:12px 10px}
.gs-top-hit .gs-lbl{padding:8px 12px 0;font-size:10px;letter-spacing:1.6px;color:var(--accent);font-weight:700;text-transform:uppercase}
.gs-guide{padding:6px 8px}
.gs-guide h3{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-muted);margin:14px 0 8px;font-weight:700}
.gs-guide .lead{font-size:13px;color:var(--text-dim);line-height:1.5;margin-top:6px}
.gs-ex{display:flex;flex-wrap:wrap;gap:6px}
.gs-tips{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;color:var(--text-dim);line-height:1.45}
.gs-tips b{color:var(--text);font-weight:600;white-space:nowrap}
.gs-tips code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:rgba(0,217,255,.08);border-radius:3px;padding:0 4px}
.gs-empty{padding:26px 10px;text-align:center;color:var(--text-dim);font-size:13px}
.gs-empty .gs-ex{justify-content:center;margin-top:10px}

.gs-strip{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#2a2306;border-bottom:1px solid #6b5a14;color:#ffe9a3;font-size:12px;flex-shrink:0;min-height:40px}
.gs-strip[hidden]{display:none}
.gs-strip .q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-strip .q b{color:#FFD84D}
.gs-strip .n{font-family:'JetBrains Mono',monospace;font-size:11px;color:#ffd84d;white-space:nowrap}
.gs-strip button{background:rgba(255,216,77,.12);border:1px solid #6b5a14;color:#ffe9a3;border-radius:6px;min-width:34px;height:30px;padding:0 9px;font:inherit;font-size:13px;cursor:pointer}
.gs-strip button:hover{background:rgba(255,216,77,.25)}
.gs-strip button:disabled{opacity:.35;cursor:default}
.gs-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--bg-panel);border:1px solid var(--accent);color:var(--text);border-radius:8px;padding:10px 16px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.gs-toast[hidden]{display:none}

@media (max-width:640px){
  .gs-open{order:3;flex-basis:100%;max-width:none;margin:0;padding:9px 12px}
  .gs-open kbd{display:none}
  .gs{padding:0}
  .gs-panel{max-width:none;max-height:none;height:100%;border-radius:0;border:0}
  .gs-top{padding:10px}
  .gs-kind{width:62px;font-size:8.5px}
  .gs-side{max-width:38%}
  .gs-strip{padding:6px 8px;gap:6px}
  .gs-strip button{min-width:32px;padding:0 7px}
}
.gs-pill.st-ontime,.gs-pill.st-hasfile{color:var(--accent-4);border-color:rgba(124,242,139,.5);background:rgba(124,242,139,.08)}
.gs-pill.st-donelate{color:#ff6b8f;border-color:rgba(255,59,107,.55);background:rgba(255,59,107,.1)}
.gs-snip{display:block;font-size:11.5px;color:var(--accent-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
<style id="fx321-css">
/* ═══ 3.21 · Visual layer — 3D maintenance scene, glass, lights and morph transitions (smooth build) ═══
   Purely visual. Every rule is behind html.fx-on, so "✦ Effects off" (or a failed script) shows the
   original 3.16 look. No data, ids, text or logic are touched. */
html[data-fx]{
  --fx-a:#00d9ff; --fx-b:#a78bfa; --fx-c:#ffb000; --fx-ok:#7cf28b; --fx-bad:#ff3b6b; --fx-warn:#ffb000;
  --fx-deep:#070b16; --fx-glass:rgba(16,22,40,.58); --fx-glass-2:rgba(22,30,54,.62); --fx-glass-3:rgba(10,14,28,.78);
  --fx-edge:rgba(255,255,255,.085); --fx-edge-2:rgba(255,255,255,.16); --fx-r:14px; --fx-blur:16px;
  --fx-ease:cubic-bezier(.2,.9,.25,1); --fx-spring:cubic-bezier(.3,1.35,.45,1);
}
html[data-fx=panel],html[data-fx=complaint]{--fx-a:#fb923c; --fx-b:#60a5fa; --fx-c:#a78bfa; --fx-ok:#22c55e; --fx-bad:#ef4444; --fx-warn:#f59e0b;
  --fx-deep:#08080b; --fx-glass:rgba(22,22,28,.6); --fx-glass-2:rgba(30,30,38,.62); --fx-glass-3:rgba(14,14,18,.8)}
html[data-fx=aic]{--fx-a:#eab308; --fx-b:#60a5fa; --fx-c:#22c55e; --fx-ok:#22c55e; --fx-bad:#ef4444; --fx-warn:#f59e0b;
  --fx-deep:#08080b; --fx-glass:rgba(22,22,28,.6); --fx-glass-2:rgba(30,30,38,.62); --fx-glass-3:rgba(14,14,18,.8)}
html[data-fx=passport]{--fx-a:#34d399; --fx-b:#60a5fa; --fx-c:#a78bfa; --fx-ok:#22c55e; --fx-bad:#ef4444; --fx-warn:#f59e0b;
  --fx-deep:#08080b; --fx-glass:rgba(22,22,28,.6); --fx-glass-2:rgba(30,30,38,.62); --fx-glass-3:rgba(14,14,18,.8)}

@property --fx-pp{syntax:'<number>';inherits:true;initial-value:0}

/* ── Ambient lights (fixed layer behind everything) ── */
#fx-bg{display:none}
html.fx-on #fx-bg{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:strict}
html.fx-on #fx-bg i{position:absolute;border-radius:50%;will-change:transform;opacity:.6}
html.fx-on #fx-bg i:nth-of-type(1){width:70vmax;height:70vmax;left:-24vmax;top:-30vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--fx-a) 34%,transparent),transparent 72%);animation:fx-drift1 26s ease-in-out infinite alternate}
html.fx-on #fx-bg i:nth-of-type(2){width:62vmax;height:62vmax;right:-26vmax;top:18vh;background:radial-gradient(closest-side,color-mix(in srgb,var(--fx-b) 26%,transparent),transparent 72%);animation:fx-drift2 32s ease-in-out infinite alternate}
html.fx-on #fx-bg i:nth-of-type(3){width:56vmax;height:56vmax;left:12vw;bottom:-34vmax;background:radial-gradient(closest-side,color-mix(in srgb,var(--fx-c) 20%,transparent),transparent 72%);animation:fx-drift3 38s ease-in-out infinite alternate}
html.fx-on #fx-bg b{position:absolute;inset:-2px;background-image:linear-gradient(rgba(255,255,255,.032) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.032) 1px,transparent 1px);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 10%,transparent 75%);mask-image:radial-gradient(ellipse 85% 60% at 50% 0%,#000 10%,transparent 75%)}
html.fx-on #fx-bg u{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--fx-a) 70%,transparent),transparent);opacity:.35;animation:fx-scan 9s linear infinite}
@keyframes fx-drift1{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(16vw,12vh,0) scale(1.18)}}
@keyframes fx-drift2{0%{transform:translate3d(0,0,0) scale(1.05)}100%{transform:translate3d(-14vw,-10vh,0) scale(.9)}}
@keyframes fx-drift3{0%{transform:translate3d(0,0,0) scale(.95)}100%{transform:translate3d(10vw,-14vh,0) scale(1.15)}}
@keyframes fx-scan{0%{transform:translateY(-10px);opacity:0}8%{opacity:.55}100%{transform:translateY(100vh);opacity:0}}
html.fx-on,html.fx-on body{background:var(--fx-deep) !important}
html.fx-on body{background:transparent !important}

/* ── Glass surfaces (shared recipe) ── */
html.fx-on :is(.card,.kpi-strip,.filters,.x13-card,.fy-tag,.month-card,.action-tile,.fx-insight,.notify-banner,details.ed-audit,.signed-tile,.rep-box,.acard,.plate){
  background:
    linear-gradient(115deg,transparent 42%,rgba(255,255,255,.07) 50%,transparent 58%) 160% 0/260% 100% no-repeat,
    radial-gradient(420px circle at var(--fx-mx,50%) var(--fx-my,-40%),rgba(255,255,255,.07),transparent 60%),
    linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.01) 38%,rgba(255,255,255,.025)),
    var(--fx-glass) !important;
  -webkit-backdrop-filter:blur(var(--fx-blur)) saturate(150%);backdrop-filter:blur(var(--fx-blur)) saturate(150%);
  border-color:var(--fx-edge) !important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.3),0 18px 40px -24px rgba(0,0,0,.85),0 2px 10px -4px rgba(0,0,0,.4);
  transition:border-color .25s,box-shadow .3s,transform .25s var(--fx-ease)}
html.fx-on :is(.card,.x13-card,.kpi-strip,.fx-insight,.acard){border-radius:var(--fx-r)}
html.fx-on :is(.card,.x13-card,.month-card,.action-tile,.fx-insight,.acard):hover{border-color:color-mix(in srgb,var(--fx-a) 38%,var(--fx-edge)) !important;

  transition:left .5s var(--fx-spring),right .5s var(--fx-spring),top .5s var(--fx-spring),bottom .5s var(--fx-spring),width .5s var(--fx-spring),height .5s var(--fx-spring),opacity .25s}

.fx-insight{display:none}

.fx-ins-t::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--fx-a);box-shadow:0 0 10px var(--fx-a),0 0 20px var(--fx-a)}

.fx-g{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px;min-width:0}

.fx-donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.fx-leg{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 110px}

.fx-bars{display:flex;flex-direction:column;gap:8px}
.fx-bar{display:grid;grid-template-columns:minmax(0,38%) 1fr auto;align-items:center;gap:8px;font-size:11.5px}
.fx-bar .l{color:var(--text-2,#a1a1a8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-bar .v{font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--text,#fff);font-size:11px;min-width:28px;text-align:right}
.fx-track{height:10px;border-radius:6px;background:rgba(255,255,255,.05);overflow:hidden;display:flex}
.fx-track i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 55%,transparent),var(--c));box-shadow:0 0 10px -1px var(--c);transform-origin:0 50%;animation:fx-grow 1s var(--fx-ease) both;animation-delay:calc(var(--k,0) * 60ms)}

.fx-key span{display:inline-flex;align-items:center;gap:5px}.fx-key i{width:8px;height:8px;border-radius:2px;background:var(--c);box-shadow:0 0 6px var(--c)}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// 3.12 — read-only access for the global search (tabs that are not opened yet)
window.__gsFs = { db: getFirestore(app), doc, getDoc };
window.__appBuild = '3.16 · 13-10-2026';

// 3.10b — always load the newest module files (no stale phone cache after a GitHub update)
const FRESH = '?v=' + Date.now();
// Gate: must be signed in
onAuthStateChanged(auth, (user) => {
  if(!user){ window.location.href = './index.html'; return; }
  document.getElementById('user-display').textContent = user.displayName || user.email;
  // Load motor PM in iframe
  const frame = document.getElementById('motor-frame');
  frame.src = './motor-pm.html' + FRESH;
  frame.onload = () => { document.getElementById('app-loader').classList.add('hide'); };
});

window.doSignOut = async () => {
  await signOut(auth);
  window.location.href = './index.html';
};

// Tab switching — lazy-load Panel PM and Complaint iframes on first click
let panelLoaded = false;
let complaintLoaded = false;
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    if(t.classList.contains('locked')) return;
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('pane-'+t.dataset.tab).classList.add('active');
    if(t.dataset.tab === 'panel' && !panelLoaded){
      const pf = document.getElementById('panel-frame');
      pf.src = './panel-pm.html' + FRESH;
      panelLoaded = true;
    }
    if(t.dataset.tab === 'complaint' && !complaintLoaded){
      const cf = document.getElementById('complaint-frame');
      cf.src = './complaint.html' + FRESH;
      complaintLoaded = true;
    }
    // Phase 3.9 — new modules, loaded on first click
    const lazy = { aic: './asset-integrity.html', passport: './passport.html' };
    if(lazy[t.dataset.tab]){
      const fr = document.getElementById(t.dataset.tab + '-frame');
      if(fr && fr.getAttribute('src') === 'about:blank') fr.src = lazy[t.dataset.tab] + FRESH;
    }
  });
});
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   3.12 · GLOBAL SEARCH — one box for Motor PM, Panel PM, Complaints,
   Asset Integrity and Factory Passport.
   • Reads each module's LIVE data from its tab (same site), or — for a tab
     not opened yet — a read-only copy from the cloud. Never writes anything.
   • Typo-tolerant, multi-word, dash/space-blind (MCC3 = MCC-3 = MCC 3),
     PM IDs, dates, status words (overdue, due, done, open, not ok …).
   • Tap a result → the tab opens, the page / record opens, the spot flashes
     yellow and every match is highlighted; ▲ ▼ on the yellow strip step
     through them.
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
const $ = id => document.getElementById(id);
const TABS = {
  motor:     { frame: 'motor-frame',     name: 'Motor PM',          icon: '⚙' },
  panel:     { frame: 'panel-frame',     name: 'Panel PM',          icon: '▤' },
  complaint: { frame: 'complaint-frame', name: 'Complaints',        icon: '🛠' },
  aic:       { frame: 'aic-frame',       name: 'Asset Integrity',   icon: '🛡' },
  passport:  { frame: 'passport-frame',  name: 'Factory Passport',  icon: '📘' },
};
const GROUPS = ['motor', 'panel', 'complaint', 'aic', 'passport', 'pages'];
const GNAME = { motor: '⚙ Motor PM', panel: '▤ Panel PM', complaint: '🛠 Complaints', aic: '🛡 Asset Integrity', passport: '📘 Factory Passport', pages: '🧭 Pages & settings' };
const SHORT = { motor: 'Motor', panel: 'Panel', complaint: 'Complaints', aic: 'Asset Integrity', passport: 'Passport', pages: 'Pages' };
const KIND = { motor: 'Motor', pm: 'PM', area: 'Area', owner: 'Owner', field: 'Checklist', holiday: 'Calendar', panel: 'Panel', punit: 'Unit',
  complaint: 'Complaint', carea: 'Area', aicitem: 'Item', record: 'Record', activity: 'Activity', equip: 'Equipment', parea: 'Area', ptype: 'Type',
  section: 'Page', action: 'Action' };
const KIND_BOOST = { motor: 6, panel: 6, equip: 6, record: 4, complaint: 4, activity: 5, aicitem: 3, area: 3, punit: 3, parea: 2, ptype: 2,
  owner: 3, field: 2, holiday: 2, carea: 1, section: 3, action: 3, pm: 0 };
const UNITS = [ { id: 'P1-FOODS', phase: 'Ph-1', name: 'Foods' }, { id: 'P1-PCPB', phase: 'Ph-1', name: 'PCPB' },
                { id: 'P1-COT', phase: 'Ph-1', name: 'COT' }, { id: 'P2-COT', phase: 'Ph-2', name: 'COT' }, { id: 'P2-PPB', phase: 'Ph-2', name: 'PPB' } ];
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const FREQ_WORDS = { BM: 'bm bimonthly bi monthly every 60 days', Q: 'q quarterly every 90 days', HY: 'hy half yearly halfyearly every 180 days' };
const CYCLE = { BM: 60, Q: 90, HY: 180 };

/* ─── small helpers ─── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const attr = v => esc(JSON.stringify(v));
const z2 = n => String(n).padStart(2, '0');
const pad3 = n => String(n).padStart(3, '0');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isoOf = d => `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`;
function dOf(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function dmy(iso){ const d = dOf(iso); return d ? `${z2(d.getDate())}-${z2(d.getMonth() + 1)}-${d.getFullYear()}` : '—'; }
function todayD(){ const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function addDaysIso(iso, n){ const d = dOf(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function startOfWeek(d){ const x = new Date(d); const w = x.getDay(); x.setDate(x.getDate() + (w === 0 ? -6 : 1 - w)); x.setHours(0, 0, 0, 0); return x; }
function addMonthsIso(iso, n){ const d = dOf(iso); if(!d) return ''; const day = d.getDate(); d.setMonth(d.getMonth() + (+n || 0)); if(d.getDate() < day) d.setDate(0); return isoOf(d); }
function unitLabel(id){ const u = UNITS.find(x => x.id === id); return u ? `${u.phase} · ${u.name}` : (id || '—'); }
function freqLabel(m){ return ({ 1: 'Monthly', 2: 'Bi-monthly', 3: 'Quarterly', 6: 'Half-yearly', 12: 'Annual', 24: 'Every 2 years', 36: 'Every 3 years', 60: 'Every 5 years' })[+m] || `Every ${m} months`; }
const AIC_BASIS = { oem: 'OEM visit', call: 'Call based', project: 'Project based', other: 'As required' };   // 3.16: activities without a fixed frequency
function aicSched(a){ return a && a.basis ? (AIC_BASIS[a.basis] || 'As required') : freqLabel(a && a.months); }
function fmtDT(s){ const d = new Date(s); return (!s || isNaN(d)) ? '—' : `${z2(d.getDate())}-${z2(d.getMonth() + 1)}-${d.getFullYear()} ${z2(d.getHours())}:${z2(d.getMinutes())}`; }
function fmtMin(m){ if(m == null || m === '') return '—'; m = +m; return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

function norm(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/(\d)[.,](?=\d)/g, '$1\u0001').replace(/[^a-z0-9\u0001]+/g, ' ').replace(/\u0001/g, '.').trim();
}
const squash = s => s.replace(/[^a-z0-9]/g, '');
let LB_OK = true; try{ new RegExp('(?<![0-9])a'); }catch(e){ LB_OK = false; }      // older iPhones: no look-behind
function mkRe(src){ if(!LB_OK) src = src.split('(?<![0-9])').join(''); return new RegExp(src, 'gi'); }

/* Damerau-Levenshtein with an early exit once the distance passes max */
function lev(a, b, max){
  if(a === b) return 0;
  const la = a.length, lb = b.length;
  if(Math.abs(la - lb) > max) return max + 1;
  let p2 = null, p = Array.from({ length: lb + 1 }, (_, j) => j);
  for(let i = 1; i <= la; i++){
    const c = [i]; let rowMin = i;
    for(let j = 1; j <= lb; j++){
      let v = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      if(p2 && i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) v = Math.min(v, p2[j - 2] + 1);
      c.push(v); if(v < rowMin) rowMin = v;
    }
    if(rowMin > max) return max + 1;
    p2 = p; p = c;
  }
  return p[lb];
}

/* plant words people use for the same thing */
const SYN_GROUPS = [
  ['transformer', 'traffo', 'trafo', 'xmer', 'trf', 'tx'], ['generator', 'genset', 'dg', 'diesel generator'],
  ['compressor', 'comp', 'compr'], ['earthing', 'earth', 'grounding'], ['holiday', 'holidays', 'festival', 'leave', 'off day'],
  ['breakdown', 'bd', 'failure', 'fault'], ['bimonthly', 'bm'], ['quarterly', 'q'], ['halfyearly', 'hy', 'half yearly'],
  ['sewage', 'stp'], ['effluent', 'etp'], ['illumination', 'lux', 'lighting'], ['thermography', 'thermal', 'ir scan'],
  ['complaint', 'complaints', 'issue'], ['backup', 'back up'], ['reschedule', 'shift date', 'change date', 'postpone'],
  ['capacitor', 'apfc', 'power factor'], ['motor', 'motors', 'mtr'], ['panel', 'panels', 'pnl'], ['pump', 'pumps'],
  ['owner', 'owners', 'responsible'], ['execution', 'executions', 'executed', 'logged'], ['markdone', 'mark done'],
];
const SYN = new Map();
SYN_GROUPS.forEach(g => g.forEach(w => { const k = norm(w); SYN.set(k, (SYN.get(k) || []).concat(g.map(norm).filter(x => x !== k))); }));
const STOP = new Set(['the', 'of', 'for', 'and', 'in', 'on', 'at', 'to', 'is', 'me', 'my', 'please', 'show', 'find', 'where', 'all']);
const STATUS_WORDS = { overdue: 'overdue', missed: 'overdue', late: 'donelate', delayed: 'donelate', ontime: 'ontime', due: 'due', upcoming: 'upcoming', soon: 'upcoming',
  files: 'hasfile', file: 'hasfile', scan: 'hasfile', scans: 'hasfile', attachment: 'hasfile', attachments: 'hasfile', photo: 'hasfile', photos: 'hasfile', checksheet: 'hasfile', checksheets: 'hasfile',
  done: 'done', completed: 'done', complete: 'done', executed: 'done', finished: 'done', pending: 'pending',
  open: 'open', ongoing: 'open', closed: 'closed', resolved: 'closed', notok: 'notok', nok: 'notok', failed: 'notok',
  observation: 'observation', scheduled: 'scheduled', norecord: 'norecord' };
const ST_TEXT = { overdue: 'Overdue', due: 'Due', upcoming: 'Upcoming', done: 'Done', pending: 'Pending', open: 'Open', closed: 'Closed',
  notok: 'Not OK', observation: 'Observation', scheduled: 'Scheduled', norecord: 'No record', ok: 'OK', ontime: 'On time', donelate: 'Done late', hasfile: 'Has check sheet' };
const PANEL_CL_DEFAULT = { pi_value: 'PI Value', ir_value: 'IR Value', busbar_torque: 'Busbar Torque', cable_term: 'Cable Termination', thermal_scan: 'Thermal Scan',
  breaker_op: 'Breaker Operation', meter_check: 'Meter Calibration', cleaning: 'Panel Cleaning', observation: 'Observation / Remarks' };
const DONE_ST = new Set(['done', 'ontime', 'donelate']);

/* ─── frames ─── */
function frameWin(tab){
  const fr = $(TABS[tab].frame);
  if(!fr || !fr.getAttribute('src') || fr.getAttribute('src') === 'about:blank') return null;
  try{ const w = fr.contentWindow; if(!w || !w.document || w.location.href === 'about:blank' || w.document.readyState === 'loading') return null; return w; }
  catch(e){ return null; }
}
function ev(w, code){ try{ return w ? w.eval(code) : undefined; }catch(e){ return undefined; } }
function modalHost(w){ const d = w.document; return d.querySelector('#modal-host.show, #m-host.show'); }
function isAdminNow(){ const w = frameWin('motor') || frameWin('panel') || frameWin('aic'); return !!(w && w.__pmRole === 'admin'); }

/* ─── data sources: live tab first, else a read-only cloud copy ─── */
const SRC = { shared: { data: null, at: 0, busy: false, err: '' }, aic: { data: null, at: 0, busy: false, err: '' }, passport: { data: null, at: 0, busy: false, err: '' },
  scans: { data: null, at: 0, busy: false, err: '' } };
const SCAN_TTL = 60 * 1000;
function scanDocIds(st){
  const ids = new Set();
  Object.keys((st && st.fys) || {}).forEach(fy => ids.add('scanidx_motor_' + fy));
  expandPanels((st && st.panels) || []).forEach(p => { if(p && p.pm_date) ids.add('scanidx_panel_' + fyOfIso(p.pm_date)); });
  return [...ids];
}
function filesFor(mod, key){ const m = SRC.scans.data && SRC.scans.data[mod]; return (m && m[key]) || []; }
const CLOUD_TTL = 5 * 60 * 1000;
async function fsGet(id){
  const f = window.__gsFs; if(!f) throw new Error('not connected');
  const s = await withTimeout(f.getDoc(f.doc(f.db, 'itc_pm', id)), 15000);
  return s.exists() ? s.data() : null;
}
function liveShared(){
  const st = ev(frameWin('motor'), "typeof STATE !== 'undefined' ? STATE : null");
  return st && st.motors && st.motors.length ? st : null;
}
function livePanel(){ const st = ev(frameWin('panel'), "typeof STATE !== 'undefined' ? STATE : null"); return st && st.panels && st.panels.length ? st : null; }
function liveComplaint(){ const st = ev(frameWin('complaint'), "typeof STATE !== 'undefined' ? STATE : null"); return st && Array.isArray(st.complaints) ? st : null; }
function liveAic(){ return ev(frameWin('aic'), "typeof A !== 'undefined' && A.master ? { master: A.master, recs: A.recs } : null") || null; }
function livePassport(){ return ev(frameWin('passport'), "typeof P !== 'undefined' && P.loadedBuckets && P.loadedBuckets.size >= 16 ? P.items : null") || null; }
function srcFrom(){
  return { shared: liveShared() ? 'live' : SRC.shared.data ? 'cloud' : '', aic: liveAic() ? 'live' : SRC.aic.data ? 'cloud' : '',
           passport: livePassport() ? 'live' : SRC.passport.data ? 'cloud' : '' };
}
function fetchMissing(force){
  const jobs = [];
  const stale = s => force || !s.data || Date.now() - s.at > CLOUD_TTL;
  if(!liveShared() && stale(SRC.shared) && !SRC.shared.busy) jobs.push(load(SRC.shared, async () => {
    const d = await fsGet('shared_state'); return d && d.payload ? JSON.parse(d.payload) : null; }));
  if(!liveAic() && stale(SRC.aic) && !SRC.aic.busy) jobs.push(load(SRC.aic, async () => {
    const m = await fsGet('aic_master'); if(!m) return { master: { activities: {}, equipment: {} }, recs: {} };
    const y = +fyOfIso(isoOf(todayD())).slice(2, 6);
    const fys = [...new Set([fyOfIso(isoOf(todayD())), `FY${y - 1}-${z2(y % 100)}`].concat(Object.keys(m.fyDocs || {})))];
    const recs = {}; await Promise.all(fys.map(async fy => { try{ const r = await fsGet('aic_records_' + fy); recs[fy] = (r && r.records) || {}; }catch(e){} }));
    return { master: { activities: m.activities || {}, equipment: m.equipment || {} }, recs }; }));
  if(!livePassport() && stale(SRC.passport) && !SRC.passport.busy) jobs.push(load(SRC.passport, async () => {
    const items = {}; await Promise.all(Array.from({ length: 16 }, (_, i) => 'passport_b' + z2(i)).map(async id => {
      const d = await fsGet(id); Object.assign(items, (d && d.items) || {}); })); return items; }));
  const sh = liveShared() || SRC.shared.data;
  if(sh && (force || Date.now() - SRC.scans.at > SCAN_TTL) && !SRC.scans.busy) jobs.push(load(SRC.scans, async () => {
    const out = { motor: {}, panel: {} };
    await Promise.all(scanDocIds(sh).map(async id => { try{
      const d = await fsGet(id); const mod = id.indexOf('scanidx_panel_') === 0 ? 'panel' : 'motor';
      Object.keys((d && d.items) || {}).forEach(fid => { const it = d.items[fid]; if(it && it.pm) (out[mod][it.pm] = out[mod][it.pm] || []).push(it.name || 'file'); });
    }catch(e){} }));
    return out; }));
  if(jobs.length) renderStatus();
  return Promise.all(jobs);
}
async function load(s, fn){
  s.busy = true; s.err = '';
  try{ s.data = await fn(); s.at = Date.now(); }catch(e){ s.err = (e && (e.code || e.message)) || 'failed'; }

function indexAic(A, out, info){
  const master = A.master || {}; const actsAll = master.activities || {}, eqAll = master.equipment || {};
  const acts = Object.values(actsAll).filter(a => a && a.id && a.active !== false).sort((x, y) => (x.order || 99) - (y.order || 99) || String(x.name).localeCompare(y.name));
  const eqs = Object.values(eqAll).filter(e => e && e.id && e.active !== false);
  const recs = []; Object.values(A.recs || {}).forEach(m => Object.values(m || {}).forEach(r => { if(r && r.id) recs.push(r); }));
  const nextDue = r => { const a = actsAll[r.actId]; return r.nextDue || (a && !a.basis && r.date ? addMonthsIso(r.date, a.months) : ''); };
  const T = isoOf(todayD()); const latest = {};
  recs.forEach(r => { const k = `${r.actId}|${r.unit}|${r.eqId || ''}`; const c = latest[k];
    if(!c || r.date > c.date || (r.date === c.date && String(r.at) > String(c.at))) latest[k] = r; });
  acts.forEach(a => {
    const units = a.units && a.units.length ? a.units : UNITS.map(u => u.id);
    out.push(mk({ mod: 'aic', kind: 'activity', title: a.name, sub: `${aicSched(a)}${a.ref ? ' · ' + a.ref : ''}`,
      fields: [[a.name, 3], [a.ref, 1.2], [a.scope, 0.7], [aicSched(a), 0.5]], go: { t: 'aicActivity', actId: a.id } }));
    if(a.basis) return;   // no fixed frequency → no due items, only its records
    units.forEach(u => {
      const list = eqs.filter(e => e.actId === a.id && e.unit === u);
      const targets = list.length ? list.map(e => ({ eqId: e.id, label: e.name, loc: e.location || '' })) : [{ eqId: '', label: 'Whole unit', loc: '' }];
      targets.forEach(t => {
        const last = latest[`${a.id}|${u}|${t.eqId}`] || null; const due = last ? nextDue(last) : '';
        let st = 'norecord';
        if(last){ const d = Math.round((dOf(due) - dOf(T)) / 86400000); st = d < 0 ? 'overdue' : d <= 30 ? 'due' : 'ok'; }
        const notOk = !!(last && last.result === 'Not OK');

        out.push(mk({ mod: 'aic', kind: 'aicitem', title: `${a.name} · ${t.label}`, st: notOk ? 'notok' : st, sortDate: due || '0000',
          sub: `${unitLabel(u)}${t.loc ? ' · ' + t.loc : ''} · last ${last ? dmy(last.date) : '—'}`, meta: due ? 'Due ' + dmy(due) : '',
          fields: [[a.name, 2.5], [t.label, 2.5], [unitLabel(u), 1.5], [t.loc, 1], [freqLabel(a.months), 0.4]],
          dates: [due], flags, go: { t: 'aicHistory', actId: a.id, unit: u, eqId: t.eqId } }));
        info.aic++;
      });
    });
  });
  recs.forEach(r => {

    const key = r.result === 'OK' || r.result === 'Closed' ? 'ok' : r.result === 'Not OK' ? 'notok' : 'observation';
    out.push(mk({ mod: 'aic', kind: 'record', title: `${a ? a.name : 'Record'} · ${target}`, st: key, sortDate: r.date,
      sub: `${unitLabel(r.unit)} · done ${dmy(r.date)}${r.reportNo ? ' · report ' + r.reportNo : ''}${r.doneBy ? ' · ' + r.doneBy : ''}`,
      fields: [[a && a.name, 2], [target, 2], [r.reportNo, 3], [r.reportDesc, 1.5], [r.doneBy, 1.2], [r.readings, 1], [r.remarks, 1], [unitLabel(r.unit), 1], [r.by, 0.4]],

/* ─── query ─── */
function parseQuery(raw){
  let s = ' ' + String(raw || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '') + ' ';
  const Q = { raw: String(raw || ''), ranges: [], isos: [], status: new Set(), statusWords: [], pm: null, labels: [] };
  const T = todayD(), Ti = isoOf(T);
  const take = (re, fn) => { s = s.replace(re, function(){ const m = Array.from(arguments); return fn(m) === false ? m[0] : ' '; }); };
  const addDay = (y, mo, d, lab) => {
    const dt = new Date(y, mo - 1, d); if(isNaN(dt) || dt.getMonth() !== mo - 1 || dt.getDate() !== d || y < 2000 || y > 2100) return false;
    const i = isoOf(dt); Q.ranges.push({ a: i, b: i }); Q.isos.push(i); Q.labels.push(lab || dmy(i));
  };
  const near = (mo, d) => { const y = T.getFullYear(); let best = null;
    [y - 1, y, y + 1].forEach(yy => { const t = new Date(yy, mo - 1, d); if(!best || Math.abs(t - T) < Math.abs(best - T)) best = t; }); return best.getFullYear(); };
  const yr = v => { v = +v; return v < 100 ? 2000 + v : v; };
  const MON = '(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\\.?';
  take(/\bm[\s-]?0*(\d{1,3})(?:\s*-\s*0*(\d{1,2}))?(?:\s*-\s*fy\s?(\d{4})\s*-?\s*(\d{2}))?(?![\d.])/g, m => {
    Q.pm = { sr: +m[1], occ: m[2] ? +m[2] : null, fy: m[3] ? `FY${m[3]}-${m[4]}` : null }; Q.labels.push('PM ' + m[0].trim().toUpperCase()); });
  take(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/g, m => addDay(+m[1], +m[2], +m[3]));
  take(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/g, m => addDay(yr(m[3]), +m[2], +m[1]));
  take(new RegExp('\\b(\\d{1,2})(?:st|nd|rd|th)?[\\s-]*' + MON + '(?:[\\s,-]+(\\d{4}))?(?![a-z0-9])', 'g'), m => { const mo = MONTHS.indexOf(m[2]) + 1; return addDay(m[3] ? +m[3] : near(mo, +m[1]), mo, +m[1]); });
  take(new RegExp('\\b' + MON + '[\\s-]+(\\d{1,2})(?:st|nd|rd|th)?(?:[\\s,]+(\\d{4}))?(?![a-z0-9])', 'g'), m => { const mo = MONTHS.indexOf(m[1]) + 1; return addDay(m[3] ? +m[3] : near(mo, +m[2]), mo, +m[2]); });
  take(new RegExp('\\b' + MON + "[\\s-']*(\\d{4})\\b", 'g'), m => { const mo = MONTHS.indexOf(m[1]) + 1, y = +m[2];
    const a = isoOf(new Date(y, mo - 1, 1)), b = isoOf(new Date(y, mo, 0)); Q.ranges.push({ a, b }); Q.labels.push(m[0].trim()); });
  take(/\btoday\b/g, () => { Q.ranges.push({ a: Ti, b: Ti }); Q.isos.push(Ti); Q.labels.push('today'); });
  take(/\btomorrow\b/g, () => { const i = addDaysIso(Ti, 1); Q.ranges.push({ a: i, b: i }); Q.isos.push(i); Q.labels.push('tomorrow'); });
  take(/\byesterday\b/g, () => { const i = addDaysIso(Ti, -1); Q.ranges.push({ a: i, b: i }); Q.isos.push(i); Q.labels.push('yesterday'); });
  take(/\b(this|next|last)\s+week\b/g, m => { const off = { this: 0, next: 7, last: -7 }[m[1]]; const a = addDaysIso(isoOf(startOfWeek(T)), off);
    Q.ranges.push({ a, b: addDaysIso(a, 6) }); Q.labels.push(m[1] + ' week'); });
  take(/\b(this|next|last)\s+month\b/g, m => { const off = { this: 0, next: 1, last: -1 }[m[1]];
    const a = isoOf(new Date(T.getFullYear(), T.getMonth() + off, 1)), b = isoOf(new Date(T.getFullYear(), T.getMonth() + off + 1, 0)); Q.ranges.push({ a, b }); Q.labels.push(m[1] + ' month'); });
  take(/\b(?:done|completed|executed)\s+(?:late|after\s+(?:over\s*)?due|delayed)\b|\b(?:late|delayed)\s+(?:done|completed)\b|\bafter\s+over\s*due\b/g, m => { Q.status.add('donelate'); Q.statusWords.push(m[0].trim()); });
  take(/\b(?:(?:done|completed)\s+)?(?:on|in)\s*time\b/g, m => { Q.status.add('ontime'); Q.statusWords.push(m[0].trim()); });
  take(/\bcheck\s*sheets?\b/g, m => { Q.status.add('hasfile'); Q.statusWords.push(m[0].trim()); });
  take(/\bnot\s*ok\b/g, () => { Q.status.add('notok'); Q.statusWords.push('not ok'); });
  take(/\bno\s*record\b/g, () => { Q.status.add('norecord'); Q.statusWords.push('no record'); });
  const words = norm(s).split(' ').filter(Boolean);
  const rest = [];
  words.forEach(w => { if(STATUS_WORDS[w]){ Q.status.add(STATUS_WORDS[w]); Q.statusWords.push(w); } else rest.push(w); });
  Q.words = rest.length > 1 ? rest.filter(w => !STOP.has(w)) : rest;
  if(!Q.words.length && rest.length) Q.words = rest;
  Q.structured = !!(Q.ranges.length || Q.status.size || Q.pm);
  return Q;
}
function tokens(words){
  return words.map(tok => {
    const tc = squash(tok), isNum = /^\d+$/.test(tok);
    const alts = new Set(SYN.get(tok) || []);
    if(tok.length >= 4 && /s$/.test(tok) && !isNum){ alts.add(tok.slice(0, -1)); if(/es$/.test(tok)) alts.add(tok.slice(0, -2)); }
    return { tok, tc, isNum, alts: [...alts].filter(a => a && a !== tok), fz: fuzzy(tok) };
  });
}
function fuzzy(tok){
  if(tok.length < 4 || /\d/.test(tok)) return [];
  if(FZ.has(tok)) return FZ.get(tok);
  const d = tok.length >= 8 ? 2 : 1, out = [];
  for(const [w] of VOCAB){
    if(w === tok) continue;
    if(Math.abs(w.length - tok.length) <= d && lev(tok, w, d) <= d) out.push(w);
    else if(tok.length >= 5 && w.length > tok.length && lev(tok, w.slice(0, tok.length), 1) <= 1) out.push(w);
    if(out.length >= 40) break;
  }
  FZ.set(tok, out); return out;
}
function fieldScore(f, tok, tc, isNum){
  if(f.ws.includes(tok)) return 10;
  if(isNum){
    for(const w of f.ws) if(w.startsWith(tok) && !/\d/.test(w.charAt(tok.length))) return 6;
    return tok.length >= 3 && f.c.includes(tc) ? 4 : 0;
  }
  if(tok.length === 1) return 0;
  for(const w of f.ws) if(w.startsWith(tok)) return 7;
  if(tok.length >= 3 && f.n.includes(tok)) return 4;
  if(tc.length >= 3 && f.c.includes(tc)) return 5;
  return 0;
}
function tokenScore(e, t){
  if(!(e.all.includes(t.tok) || (t.tc.length >= 3 && e.allc.includes(t.tc)) || t.alts.some(a => e.all.includes(a)) || t.fz.some(a => e.W.has(a)))) return null;
  let best = 0, ctx = true;
  for(const f of e.F){
    let s = fieldScore(f, t.tok, t.tc, t.isNum);
    if(!s) for(const a of t.alts){ const x = fieldScore(f, a, squash(a), false) * 0.8; if(x > s) s = x; }
    if(!s) for(const a of t.fz){ if(f.ws.includes(a)){ s = 3; break; } }
    if(s){ const v = s * f.w; if(v > best || (v === best && !f.ctx)){ best = v; ctx = f.ctx; } }
  }
  return best ? { s: best, ctx } : null;
}
function scoreEntry(e, Q, toks, mode){
  if(Q.ranges.length && !e.dates.some(d => Q.ranges.some(r => d >= r.a && d <= r.b))) return 0;
  if(Q.status.size && ![...Q.status].some(s => e.flags.has(s))) return 0;
  if(Q.pm){
    if(e.sr !== Q.pm.sr) return 0;
    if(e.kind === 'pm' && Q.pm.occ != null && e.occ !== Q.pm.occ) return 0;
    if(e.kind === 'pm' && Q.pm.fy && !e.title.endsWith(Q.pm.fy)) return 0;
  }
  let score = 0, hits = 0, own = false;
  for(const t of toks){
    const r = tokenScore(e, t);
    if(!r){ if(mode === 'and') return 0; continue; }
    score += r.s; hits++; if(!r.ctx) own = true;
  }
  if(toks.length && !hits) return 0;
  if(e.secondary && !Q.structured && !own) return 0;          // PM rows need a PM-type query (ID, date, status or a remark)
  if(toks.length){
    if(e.tn === Q.text || (Q.textc.length >= 3 && e.tc === Q.textc)) score += 30;
    else if(Q.text.length >= 2 && e.tn.includes(Q.text)) score += 18;
    else if(Q.textc.length >= 3 && e.tc.includes(Q.textc)) score += 12;
    if(mode === 'or') score *= hits / toks.length;
  } else score = 10;
  if(Q.pm){ if(e.kind === 'motor') score += Q.pm.occ != null ? 20 : 40; if(e.kind === 'pm') score += Q.pm.occ != null ? 45 : 8; }
  score += KIND_BOOST[e.kind] || 0;
  if(e.admin && !isAdminNow()) score *= 0.6;
  return score;
}
function search(Q){
  Q.text = Q.words.join(' '); Q.textc = squash(Q.text);
  const toks = tokens(Q.words);
  const exec = (q, tk, mode) => { const res = [];
    for(const e of IX){ const s = scoreEntry(e, q, tk, mode); if(s > 0) res.push({ e, s }); }
    const desc = [...q.status].some(x => DONE_ST.has(x));
    res.sort((a, b) => b.s - a.s || (desc ? String(b.e.sortDate || '').localeCompare(String(a.e.sortDate || '')) : String(a.e.sortDate || '9').localeCompare(String(b.e.sortDate || '9'))) || a.e.title.length - b.e.title.length);
    return res; };
  let res = exec(Q, toks, 'and'), how = '';
  if(!res.length && Q.statusWords.length){                    // "open", "due" … were meant as plain words
    const keep = new Set(Q.words.concat(...Q.statusWords.map(w => norm(w).split(' '))));
    const q2 = Object.assign({}, Q, { status: new Set(), statusWords: [], words: norm(Q.raw).split(' ').filter(w => keep.has(w)) });   // original word order
    q2.structured = !!(q2.ranges.length || q2.pm); q2.text = q2.words.join(' '); q2.textc = squash(q2.text);
    const t2 = tokens(q2.words); res = exec(q2, t2, 'and'); if(res.length){ Object.assign(Q, q2); toks.splice(0, toks.length, ...t2); }
  }
  if(!res.length && toks.length > 1){ res = exec(Q, toks, 'or'); if(res.length) how = 'close'; }
  return { res, toks, how };
}
function suggestions(Q){
  const out = [];
  Q.words.forEach(w => {
    if(w.length < 3 || /\d/.test(w)) return;
    const c = VOCAB.map(([v, n]) => [v, lev(w, v, 3), n]).filter(x => x[1] <= Math.max(2, Math.floor(w.length / 3))).sort((a, b) => a[1] - b[1] || b[2] - a[2]).slice(0, 4);
    c.forEach(x => out.push(Q.raw.toLowerCase().replace(w, x[0])));
  });
  return [...new Set(out)].slice(0, 6);
}

/* highlight pattern shared by the results list and the in-page highlighter */
function hlSource(Q, toks){
  const pats = [];
  const chars = w => w.split('').map(reEsc).join('[\\W_]*');
  toks.forEach(t => {
    if(t.isNum) pats.push('(?<![0-9])0*' + reEsc(t.tok) + '(?![0-9])');
    else if(t.tok.length === 1) pats.push('\\b' + reEsc(t.tok) + '\\b');
    else if(t.tc) pats.push(chars(t.tc));
    t.alts.concat(t.fz.slice(0, 12)).forEach(a => { const ws = a.split(' ').filter(Boolean); if(ws.length) pats.push(ws.map(chars).join('[\\W_]+')); });
  });
  Q.isos.forEach(i => { const [y, m, d] = i.split('-'); pats.push(`${d}[-·/.]${m}[-·/.]${y}`, i); });
  if(Q.pm) pats.push('M0*' + Q.pm.sr + (Q.pm.occ != null ? '-0*' + Q.pm.occ : '') + '(?![0-9])');
  if(!pats.length) return '';
  return pats.sort((a, b) => b.length - a.length).join('|');
}
function hl(text, src){
  text = String(text == null ? '' : text); if(!src) return esc(text);
  const re = mkRe(src); let out = '', last = 0, m;
  while((m = re.exec(text))){ if(!m[0]){ re.lastIndex++; continue; } out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>'; last = m.index + m[0].length; }
  return out + esc(text.slice(last));
}

        '<div class="fx-lead">Preventive maintenance for motors, panels, complaints, statutory assets and the factory passport — one live system, aiming at zero downtime.</div></div>' +
        '<div class="fx-stage" aria-hidden="true"></div>' +
        '<div class="fx-now" aria-live="off"><span class="fx-now-k" aria-hidden="true"></span><b class="fx-now-t">Engineering showreel</b><span class="fx-now-s">3-D maintenance views</span>' +
        '<i class="fx-now-bar" aria-hidden="true"><u></u></i><span class="fx-now-dots" aria-hidden="true"></span></div>' +
        '<div class="fx-mods"><span><b></b>Motor PM</span><span><b></b>Panel PM</span><span><b></b>Complaints</span><span><b></b>Asset Integrity</span><span><b></b>Factory Passport</span></div>';
      shell.parentNode.insertBefore(h, shell);
      var nowEl = h.querySelector('.fx-now'), tEl = h.querySelector('.fx-now-t'), sEl = h.querySelector('.fx-now-s'), bar = h.querySelector('.fx-now-bar u'), dots = h.querySelector('.fx-now-dots'), lastKey = '';
      setInterval(safe(function(){
        var S = W.__fxScene; if(D.hidden || !S || !S.quality || !H.classList.contains('fx-3d')) return;
        var q = S.quality(), inf = q && q.info; if(!inf) return;
        if(dots.children.length !== inf.n){ dots.innerHTML = new Array(inf.n + 1).join('<i></i>'); }
        if(inf.key !== lastKey){
          var first = !lastKey; lastKey = inf.key; nowEl.classList.add('swap');
          setTimeout(function(){ tEl.textContent = inf.title; sEl.textContent = inf.sub; nowEl.classList.remove('swap'); }, first ? 0 : 320);
          [].forEach.call(dots.children, function(d, i){ d.classList.toggle('on', i === inf.i); });
        }
        var sx = Math.min(1, inf.w / 0.95);
        if(sx < (bar.__x || 0)){ bar.style.transition = 'none'; bar.style.transform = 'scaleX(0)'; void bar.offsetWidth; bar.style.transition = ''; }
        bar.__x = sx; bar.style.transform = 'scaleX(' + sx.toFixed(3) + ')';
      }), 400);
    }
  });

  /* ── 3.21 · figures the 3-D world reads to colour itself (only what the module already shows; read-only) ── */
  function txt(id){ var e = D.getElementById(id); return e ? (e.textContent || '').trim() : ''; }
  function num(id){ var v = parseFloat(txt(id).replace(/,/g, '').replace(/[^\d.\-]/g, '')); return isFinite(v) ? v : null; }
  function cmpCat(c){
    var s = ((c && c.issue) || '') + ' ' + ((c && c.actionTaken) || ''); s = s.toLowerCase();
    if(/bearing|noise|vibrat|greas/.test(s)) return 'bearing';
    if(/pump|gland|seal|impeller|valve|leak|cavitat|suction|discharge/.test(s)) return 'pump';
    if(/panel|mccb|mcb|breaker|vfd|drive|contactor|relay|cable|fuse|starter|acb|vcb|trip|feeder/.test(s)) return 'panel';
    return 'motor';
  }
  function aicCat(name){
    var s = (name || '').toLowerCase();
    if(/boiler|ibr|steam|safety valve|economi|feed ?water|chimney|stack|burner|deaerat|thermic|furnace/.test(s)) return 'boiler';
    if(/hydro|receiver|pressure vessel|vessel|lift|tackle|hoist|crane|ladder|sling|chain|compressor|mechanical|scaffold/.test(s)) return 'mechanical';
    return 'electrical';
  }
  function collectData(){
    if(MOD === 'motor') return { compl: num('kpi-compl'), overdue: num('kpi-overdue'), due: num('d-due'), total: num('kpi-motors') };
    if(MOD === 'panel') return { compl: num('k-comp'), overdue: num('k-over'), due: num('k-due'), total: num('k-total') };
    if(MOD === 'complaint'){
      var S = null; try{ S = (typeof STATE !== 'undefined') ? STATE : null; }catch(e){}
      var list = S && Array.isArray(S.complaints) ? S.complaints : [], cats = { motor: { n: 0, open: 0 }, pump: { n: 0, open: 0 }, bearing: { n: 0, open: 0 }, panel: { n: 0, open: 0 } }, last = null, lastAt = '';
      list.forEach(function(c){ var k = cmpCat(c); cats[k].n++; if(String(c.status || '').toLowerCase() !== 'closed') cats[k].open++; var at = String(c.loggedAt || c.start || ''); if(at >= lastAt){ lastAt = at; last = k; } });
      return { cats: cats, last: last, n: list.length };
    }
    if(MOD === 'aic'){
      var cat = { electrical: { ok: 0, due: 0, over: 0, none: 0 }, mechanical: { ok: 0, due: 0, over: 0, none: 0 }, boiler: { ok: 0, due: 0, over: 0, none: 0 } };
      [].forEach.call(D.querySelectorAll('#ov-matrix tbody tr'), function(tr){
        var td = tr.querySelector('td'); if(!td) return; var k = aicCat(td.textContent);
        [].forEach.call(tr.querySelectorAll('.cell'), function(c){ var cl = c.classList; if(cl.contains('ok')) cat[k].ok++; else if(cl.contains('due')) cat[k].due++; else if(cl.contains('over')) cat[k].over++; else if(cl.contains('none')) cat[k].none++; });
      });
      return { cat: cat };
    }
    if(MOD === 'passport'){
      var items = []; try{ items = (typeof allItems === 'function') ? allItems() : []; }catch(e){ items = []; }
      var by = {}; items.forEach(function(i){ var k = 'General'; try{ k = (typeof systemOf === 'function') ? systemOf(i.area) : 'General'; }catch(e){} by[k] = (by[k] || 0) + 1; });
      return { total: items.length, bySys: by };
    }
    return null;
  }
  var dataSig = '', dataT = 0;
  function sceneData(force){
    var S = W.__fxScene; if(!S || !S.data) return;
    var now = Date.now(); if(!force && now - dataT < 1500) return; dataT = now;
    var d = null; try{ d = collectData(); }catch(e){ warn(e); }
    if(!d) return; var sig = JSON.stringify(d); if(sig === dataSig) return; dataSig = sig;
    try{ S.data(d); }catch(e){ warn(e); }
  }

  /* ── scheduler: one pass per frame after any change on the page ── */
  var pend = 0, pendT = 0, lastPass = 0;
  var pass = safe(function(){
    pend = 0; lastPass = Date.now();
    syncTabs(); syncPanes(); syncKpi(); syncFixed(); modalHold();
    if(MOD === 'complaint') complaintGraphs();
    if(MOD === 'aic') aicGraphs();
    if(MOD === 'passport') passportGraphs();
    sceneData(false);
  });
  function schedule(){ if(!pend) pend = requestAnimationFrame(pass); }
  function scheduleSoon(){   // coalesce bursts of DOM changes (big list renders) into one pass
    if(pend || pendT) return;
    var wait = Math.max(0, 120 - (Date.now() - lastPass));
    pendT = setTimeout(function(){ pendT = 0; schedule(); }, wait);
  }
  var held = false;
  function modalHold(){   // while a form is open the 3D scene pauses, so typing stays smooth
    var open = !!D.querySelector('#modal-host.show,#m-host.show,#cx-host.show,.gs:not([hidden])');
    if(open !== held){ held = open; try{ if(W.__fxScene) W.__fxScene.hold(open); }catch(e){ warn(e); } }
  }

  W.__fx = { apply: safe(apply), refresh: schedule, build: W.__fxBuild };
  var boot = safe(function(){
    lights(); chartTheme(); appShell(); indexPage(); bindPointer();
    if(MOD !== 'app') apply();
    try{ new MutationObserver(function(){ scheduleSoon(); }).observe(D.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'hidden'] }); }catch(e){ warn(e); }
    W.addEventListener('resize', schedule, { passive: true });
    W.addEventListener('storage', function(e){ if(e.key === 'pmfx') apply(); });
    try{ if(D.fonts && D.fonts.ready) D.fonts.ready.then(function(){ D.querySelectorAll('.fx-has-ind').forEach(function(c){ c.__fxR = null; }); schedule(); }); }catch(e){}
    D.addEventListener('click', function(){ schedule(); }, true);
    setInterval(function(){ if(!D.hidden && W.innerWidth > 2) scheduleSoon(); }, 4000);
    schedule();
  });
  if(D.readyState === 'loading') D.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
