    try{ if(!W.Chart || !W.Chart.instances) return; Object.keys(W.Chart.instances).forEach(function(id){ var c = W.Chart.instances[id]; try{ c.update(); }catch(e){} }); }catch(e){ warn(e); }
  }

  /* ── 8 · graph builders (SVG / CSS, animated) ── */
  function donut(segs, total, label){
    var R = 44, C = 2 * Math.PI * R, off = 0, sum = segs.reduce(function(s, x){ return s + x.v; }, 0);
    var arcs = segs.filter(function(x){ return x.v > 0; }).map(function(x){
      var len = sum ? x.v / sum * C : 0, gap = segs.length > 1 && len > 3 ? 1.6 : 0;
      var s = '<circle class="s" cx="56" cy="56" r="' + R + '" stroke="' + x.c + '" style="--c:' + x.c + '" stroke-dasharray="' + Math.max(0, len - gap).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"><title>' + esc(x.l) + ': ' + x.v + '</title></circle>';
      off += len; return s;
    }).join('');
    return '<div class="fx-donut"><svg viewBox="0 0 112 112" role="img" aria-label="' + esc(label) + '">' +
      '<circle cx="56" cy="56" r="' + R + '" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="13"/>' + arcs +
      '<text class="ctr" x="56" y="58" text-anchor="middle">' + esc(total) + '</text><text class="ctl" x="56" y="74" text-anchor="middle">' + esc(label) + '</text></svg>' +
      '<div class="fx-leg">' + segs.map(function(x){ return '<span style="--c:' + x.c + '"><i></i>' + esc(x.l) + '<b>' + x.v + '</b></span>'; }).join('') + '</div></div>';
  }
  function bars(rows, keys){
    var max = Math.max.apply(null, [1].concat(rows.map(function(r){ return r.vs.reduce(function(s, v){ return s + v; }, 0); })));
    return '<div class="fx-bars">' + rows.map(function(r, i){
      var tot = r.vs.reduce(function(s, v){ return s + v; }, 0);
      return '<div class="fx-bar" title="' + esc(r.l) + '"><span class="l">' + esc(r.l) + '</span><span class="fx-track">' +
        r.vs.map(function(v, j){ return v > 0 ? '<i style="--c:' + keys[j].c + ';--k:' + i + ';width:' + (v / max * 100).toFixed(2) + '%" title="' + esc(keys[j].l) + ': ' + v + '"></i>' : ''; }).join('') +
        '</span><span class="v">' + esc(r.t != null ? r.t : tot) + '</span></div>';
    }).join('') + '</div>' + (keys.length > 1 ? '<div class="fx-key">' + keys.map(function(k){ return '<span style="--c:' + k.c + '"><i></i>' + esc(k.l) + '</span>'; }).join('') + '</div>' : '');
  }
  function cols(items, keys){
    var max = Math.max.apply(null, [1].concat(items.map(function(it){ return Math.max.apply(null, it.vs); })));
    return '<div class="fx-cols">' + items.map(function(it, i){
      return '<div class="fx-col" title="' + esc(it.l) + ' — ' + keys.map(function(k, j){ return k.l + ': ' + it.vs[j]; }).join(', ') + '"><span class="n">' + it.vs.join('·') + '</span><span class="st">' +
        it.vs.map(function(v, j){ return '<i style="--c:' + keys[j].c + ';--k:' + i + ';height:' + (v / max * 100).toFixed(2) + '%"></i>'; }).join('') + '</span><span class="x">' + esc(it.l) + '</span></div>';
    }).join('') + '</div><div class="fx-key">' + keys.map(function(k){ return '<span style="--c:' + k.c + '"><i></i>' + esc(k.l) + '</span>'; }).join('') + '</div>';
  }
  function insight(id, title, meta){
    var el = D.getElementById(id);
    if(!el){
      el = D.createElement('section'); el.id = id; el.className = 'fx-insight';
      if(store('pmfx-closed-' + id) === '1') el.classList.add('fx-closed');
      el.innerHTML = '<div class="fx-ins-h"><div><div class="fx-ins-t">' + esc(title) + '</div><div class="fx-ins-m"></div></div><button type="button" class="fx-ins-x"></button></div><div class="fx-ins-b"></div>';
      var btn = el.querySelector('.fx-ins-x');
      var lbl = function(){ btn.textContent = el.classList.contains('fx-closed') ? '▾ Show graphs' : '▴ Hide'; };
      btn.addEventListener('click', safe(function(){ el.classList.toggle('fx-closed'); store('pmfx-closed-' + id, el.classList.contains('fx-closed') ? '1' : '0'); lbl(); }));
      lbl();
    }
    el.querySelector('.fx-ins-m').textContent = meta || '';
    return el;
  }
  function monthKey(iso){ return String(iso || '').slice(0, 7); }
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /* Complaint register — analytics from the complaints already on screen (read-only) */
  var cmpSig = '';
  var complaintGraphs = safe(function(){
    var S = null; try{ S = (typeof STATE !== 'undefined') ? STATE : null; }catch(e){}
    var strip = D.querySelector('.wrap > .kpi-strip'); if(!S || !strip) return;
    var list = Array.isArray(S.complaints) ? S.complaints : [];
    var sig = list.length + '|' + list.map(function(c){ return c.id + (c.status || '') + (c.downtimeMin || '') + (c.area || '') + (c.start || ''); }).join(',');
    var el = D.getElementById('fx-cmp');
    if(el && el.previousElementSibling === strip && sig === cmpSig) return;
    cmpSig = sig;
    el = insight('fx-cmp', '📊 Complaint analytics', list.length + ' complaints');
    if(el.previousElementSibling !== strip) strip.parentNode.insertBefore(el, strip.nextSibling);
    var open = 0, closed = 0, byArea = {}, down = {}, byMon = {};
    list.forEach(function(c){
      var isOpen = String(c.status || '').toLowerCase() !== 'closed';
      if(isOpen) open++; else closed++;
      var a = c.area || '—'; byArea[a] = byArea[a] || [0, 0]; byArea[a][isOpen ? 0 : 1]++;
      if(+c.downtimeMin > 0) down[a] = (down[a] || 0) + (+c.downtimeMin);
      var mk = monthKey(c.start || c.loggedAt); if(mk){ byMon[mk] = byMon[mk] || [0, 0]; byMon[mk][0]++; if(!isOpen) byMon[mk][1]++; }
    });
    var OK = cssVar('--fx-ok', '#22c55e'), BAD = cssVar('--fx-bad', '#ef4444'), A = cssVar('--fx-a', '#fb923c'), B = cssVar('--fx-b', '#60a5fa'), WARN = cssVar('--fx-warn', '#f59e0b');
    var now = new Date(), months = [];
    for(var i = 5; i >= 0; i--){ var d = new Date(now.getFullYear(), now.getMonth() - i, 1); var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); months.push({ l: MON[d.getMonth()], vs: (byMon[k] || [0, 0]).slice() }); }
    var areas = Object.keys(byArea).map(function(a){ return { l: a, vs: byArea[a] }; }).sort(function(x, y){ return (y.vs[0] + y.vs[1]) - (x.vs[0] + x.vs[1]); }).slice(0, 6);
    var dts = Object.keys(down).map(function(a){ return { l: a, vs: [down[a]], t: down[a] >= 60 ? (down[a] / 60).toFixed(1) + 'h' : down[a] + 'm' }; }).sort(function(x, y){ return y.vs[0] - x.vs[0]; }).slice(0, 6);
    var b = el.querySelector('.fx-ins-b');
    b.innerHTML = list.length ? (
      '<div class="fx-g"><div class="fx-g-t">Open vs resolved</div>' + donut([{ l: 'Open', v: open, c: BAD }, { l: 'Resolved', v: closed, c: OK }], list.length, 'total') + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">Last 6 months</div>' + cols(months, [{ l: 'Logged', c: A }, { l: 'Resolved', c: OK }]) + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">Top areas</div>' + bars(areas, [{ l: 'Open', c: BAD }, { l: 'Resolved', c: B }]) + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">Downtime by area</div>' + (dts.length ? bars(dts, [{ l: 'Downtime', c: WARN }]) : '<div class="fx-empty">No downtime logged yet.</div>') + '</div>'
    ) : '<div class="fx-empty">Graphs appear here as soon as complaints are logged.</div>';
  });

  /* Asset Integrity — compliance picture from the matrix on screen (read-only) */
  var aicSig = '';
  var aicGraphs = safe(function(){
    var kp = D.getElementById('ov-kpis'), mx = D.getElementById('ov-matrix');
    var el = D.getElementById('fx-aic');
    if(!kp || !mx){ return; }
    var heads = [].slice.call(mx.querySelectorAll('thead th')).slice(1).map(function(t){ return (t.textContent || '').replace(/\s+/g, ' ').trim(); });
    var per = heads.map(function(){ return { ok: 0, due: 0, over: 0, none: 0, g: 0, n: 0 }; });
    [].forEach.call(mx.querySelectorAll('tbody tr'), function(tr){
      var tds = tr.querySelectorAll('td'); if(tds.length < 2) return;
      for(var i = 1; i < tds.length && i - 1 < per.length; i++){
        var c = tds[i].querySelector('.cell') || tds[i];
        var cl = c.classList;
        if(cl.contains('ev') || cl.contains('evnone') || cl.contains('na') || cl.contains('add')) continue;
        var q = per[i - 1];
        if(cl.contains('over')) q.over++; else if(cl.contains('due')) q.due++; else if(cl.contains('ok')) q.ok++; else if(cl.contains('none')) q.none++; else continue;
        var fr = ((c.querySelector('b') || {}).textContent || '').match(/^(\d+)\s*\/\s*(\d+)$/);
        if(fr){ q.g += +fr[1]; q.n += +fr[2]; }
      }
    });
    var sig = JSON.stringify([heads, per]);
    if(el && el.previousElementSibling === kp && sig === aicSig) return;
    aicSig = sig;
    var T = per.reduce(function(s, p){ s.ok += p.ok; s.due += p.due; s.over += p.over; s.none += p.none; s.g += p.g; s.n += p.n; return s; }, { ok: 0, due: 0, over: 0, none: 0, g: 0, n: 0 });
    var all = T.ok + T.due + T.over + T.none, pct = T.n ? Math.round(T.g / T.n * 100) : 0;
    el = insight('fx-aic', '📊 Compliance picture', T.g + ' of ' + T.n + ' items within frequency · ' + all + ' activity × unit cells');
    if(el.previousElementSibling !== kp) kp.parentNode.insertBefore(el, kp.nextSibling);
    var OK = cssVar('--fx-ok', '#22c55e'), DUE = cssVar('--fx-warn', '#f59e0b'), BAD = cssVar('--fx-bad', '#ef4444'), NONE = '#6b7280';
    var keys = [{ l: 'OK', c: OK }, { l: 'Due soon', c: DUE }, { l: 'Overdue', c: BAD }, { l: 'No record', c: NONE }];
    el.querySelector('.fx-ins-b').innerHTML = all ? (
      '<div class="fx-g"><div class="fx-g-t">All units · cells by status</div>' + donut([{ l: 'OK', v: T.ok, c: OK }, { l: 'Due soon', v: T.due, c: DUE }, { l: 'Overdue', v: T.over, c: BAD }, { l: 'No record', v: T.none, c: NONE }], pct + '%', 'in freq.') + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">By unit · % items within frequency</div>' + bars(heads.map(function(h, i){ var p = per[i]; return { l: h, vs: [p.ok, p.due, p.over, p.none], t: p.n ? Math.round(p.g / p.n * 100) + '%' : '—' }; }), keys) + '</div>'
    ) : '<div class="fx-empty">Graphs appear once activities are set up.</div>';
  });

  /* Factory Passport — meter on each system tile (By area) + equipment picture on the Reports tab (read-only) */
  var fpSig = '';
  var passportGraphs = safe(function(){
    var tiles = D.querySelectorAll('.sys-grid .sys');
    if(tiles.length){
      var vals = [].map.call(tiles, function(t){ var c = t.querySelector('.ct'); return c ? (parseFloat((c.textContent || '').replace(/[^\d.]/g, '')) || 0) : 0; });
      var mx = Math.max.apply(null, [1].concat(vals));
      [].forEach.call(tiles, function(t, i){ var p = (vals[i] / mx).toFixed(3); if(t.style.getPropertyValue('--fx-p') !== p) t.style.setProperty('--fx-p', p); });
    }
    var host = D.getElementById('view-reports'); if(!host) return;
    var items = [];
    try{ items = (typeof allItems === 'function') ? allItems() : []; }catch(e){ items = []; }
    var bySys = {}, byUnit = {}, photos = 0;
    items.forEach(function(i){
      var k = 'General'; try{ k = (typeof systemOf === 'function') ? systemOf(i.area) : 'General'; }catch(e){}
      bySys[k] = (bySys[k] || 0) + 1;
      var u = i.unit || '—'; byUnit[u] = (byUnit[u] || 0) + 1;
      if(i.photo || (Array.isArray(i.photos) && i.photos.length) || i.photoId || i.img) photos++;
    });
    var rows = Object.keys(bySys).map(function(k){
      var ic = ''; try{ ic = (typeof sysDef === 'function') ? (sysDef(k).ic || '') : ''; }catch(e){}
      return { l: (ic ? ic + ' ' : '') + k, n: k, v: bySys[k] };
    }).sort(function(a, b){ return b.v - a.v; });
    var sig = JSON.stringify([rows, byUnit]);
    var el = D.getElementById('fx-fp');
    if(el && el.parentNode === host && sig === fpSig) return;
    fpSig = sig;
    el = insight('fx-fp', '📊 Equipment picture', items.length + ' items');
    if(el.parentNode !== host) host.insertBefore(el, host.firstChild);
    var PAL = [cssVar('--fx-a', '#34d399'), '#60a5fa', '#a78bfa', '#f59e0b', '#f472b6', '#22d3ee', '#facc15', '#fb923c', '#4ade80', '#818cf8', '#94a3b8'];
    var top = rows.slice(0, 7), rest = rows.slice(7).reduce(function(s, r){ return s + r.v; }, 0);
    var segs = top.map(function(r, i){ return { l: r.n, v: r.v, c: PAL[i % PAL.length] }; });
    if(rest) segs.push({ l: 'Other', v: rest, c: PAL[10] });
    var uName = function(u){ return u === 'P1-COT' ? 'Ph-1 · COT' : u === 'P2-PPB' ? 'Ph-2 · PPB' : u; };
    var units = Object.keys(byUnit).sort().map(function(u, i){ return { l: uName(u), v: byUnit[u], c: [PAL[0], PAL[1], PAL[2], PAL[3]][i % 4] }; });
    el.querySelector('.fx-ins-b').innerHTML = items.length ? (
      '<div class="fx-g"><div class="fx-g-t">Share by system</div>' + donut(segs, items.length, 'items') + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">Count by system</div>' + bars(rows.slice(0, 9).map(function(r){ return { l: r.l, vs: [r.v] }; }), [{ l: 'Items', c: PAL[0] }]) + '</div>' +
      '<div class="fx-g"><div class="fx-g-t">By phase</div>' + donut(units, units.length ? Math.round(units.reduce(function(m, u){ return Math.max(m, u.v); }, 0) / items.length * 100) + '%' : '—', units.length ? units.slice().sort(function(x, y){ return y.v - x.v; })[0].l : '') + '</div>'
    ) : '<div class="fx-empty">Graphs appear once equipment is loaded.</div>';
  });

  /* ── 9 · app shell: switch, orbit mark, tab direction for the 3D page turn ── */
  function mode(){ var m = store('pmfx'); return m === 'off' ? 'off' : m === 'lite' ? 'lite' : '3d'; }
  var LBL = { '3d': ['FX 3D', '3D', 'Effects: full 3D (3.18) — tap for Lite on a slow phone'], lite: ['FX LITE', 'LITE', 'Effects: Lite — glass and light, no 3D scene. Tap to switch effects off'], off: ['FX OFF', 'OFF', 'Effects off — plain look. Tap for full 3D'] };
  function apply(){
    var m = mode(), on = m !== 'off';
    H.classList.toggle('fx-on', on);
    var S = W.__fxScene, want3d = m === '3d';
    if(want3d && S && !S.ok() && !H.__fxTried){ H.__fxTried = 1; S.init(); }
    var has3d = want3d && !!(S && S.ok());
    H.classList.toggle('fx-3d', has3d);
    try{ if(S){ if(has3d) S.start(); else S.stop(); } }catch(e){ warn(e); }
    var sw = D.querySelector('.fx-sw'); if(sw){ var L = LBL[m]; sw.setAttribute('data-m', m); sw.querySelector('.t').textContent = L[0]; sw.querySelector('.t2').textContent = L[1]; sw.title = L[2]; sw.setAttribute('aria-label', L[2]); }
    chartsRefresh(); schedule();
    try{ [].forEach.call(D.querySelectorAll('iframe'), function(f){ try{ if(f.contentWindow && f.contentWindow.__fx) f.contentWindow.__fx.apply(); }catch(e){} }); }catch(e){}
  }
  var appShell = safe(function(){
    if(MOD !== 'app') return;
    var ub = D.querySelector('.user-block'), so = ub && ub.querySelector('.signout-btn');
    if(ub && !ub.querySelector('.fx-sw')){
      var b = D.createElement('button'); b.type = 'button'; b.className = 'fx-sw';
      b.innerHTML = '<span class="d"></span><span class="t">FX 3D</span><span class="t2">3D</span>';
      b.addEventListener('click', safe(function(){ var m = mode(); store('pmfx', m === '3d' ? 'lite' : m === 'lite' ? 'off' : 'on'); apply(); }));
      ub.insertBefore(b, so || null);
    }
    var br = D.querySelector('.app-header .brand');
    if(br && !br.querySelector('.fx-orbit')){ var o = D.createElement('span'); o.className = 'fx-orbit'; o.setAttribute('aria-hidden', 'true'); o.innerHTML = '<i></i><i></i><i></i>'; br.insertBefore(o, br.firstChild); }
    var tabs = [].slice.call(D.querySelectorAll('.tabbar .tab')), tc = D.querySelector('.tab-content');
    D.addEventListener('click', safe(function(e){
      var t = e.target && e.target.closest && e.target.closest('.tabbar .tab'); if(!t || !tc) return;
      var cur = D.querySelector('.tabbar .tab.active');
      var dir = Math.sign(tabs.indexOf(t) - tabs.indexOf(cur)) || 0;
      tc.style.setProperty('--fx-dir', dir);
      try{ if(W.__fxScene) W.__fxScene.page(t.getAttribute('data-tab')); }catch(err){ warn(err); }
    }), true);
    apply();
  });
  var indexPage = safe(function(){
    if(MOD !== 'index') return;
    var br = D.querySelector('.brand');
    if(br && !D.querySelector('.fx-gyro')){
      var g = D.createElement('div'); g.className = 'fx-gyro'; g.setAttribute('aria-hidden', 'true');
      g.innerHTML = '<i></i><i></i><i></i><b></b>';
      br.insertBefore(g, br.firstChild);
    }
  });

  /* ── scheduler: one pass per frame after any change on the page ── */
  var pend = 0;
  var pass = safe(function(){
    pend = 0;
    syncTabs(); syncPanes(); syncKpi(); syncFixed();
    if(MOD === 'complaint') complaintGraphs();
    if(MOD === 'aic') aicGraphs();
    if(MOD === 'passport') passportGraphs();
  });
  function schedule(){ if(!pend) pend = requestAnimationFrame(pass); }

  W.__fx = { apply: safe(apply), refresh: schedule, build: W.__fxBuild };
  var boot = safe(function(){
    lights(); chartTheme(); appShell(); indexPage(); bindPointer();
    if(MOD !== 'app') apply();
    try{ new MutationObserver(function(){ schedule(); }).observe(D.body, { subtree: true, childList: true, attributes: true, attributeFilter: ['class', 'hidden'] }); }catch(e){ warn(e); }
    W.addEventListener('resize', schedule, { passive: true });
    W.addEventListener('storage', function(e){ if(e.key === 'pmfx') apply(); });
    try{ if(D.fonts && D.fonts.ready) D.fonts.ready.then(function(){ D.querySelectorAll('.fx-has-ind').forEach(function(c){ c.__fxR = null; }); schedule(); }); }catch(e){}
    setInterval(function(){ if(!D.hidden) schedule(); }, 2500);
    schedule();
  });
  if(D.readyState === 'loading') D.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
