      closeModal(); setView('find');
      toast('Site data loaded', `${nNew} new · ${nUpd} refreshed · ${nPh} photo${nPh === 1 ? '' : 's'} attached`);
    }catch(e){ if(btn){ btn.disabled = false; btn.textContent = 'Try again'; } st('Stopped: ' + friendlyErr(e) + ' — tap Try again; entries already saved are skipped.'); refresh(); }
  };

  /* ─── Reports: Excel passport book + PDF datasheets ─── */
  const R = { unit: '', area: '', type: '', q: '', photos: true };
  function repList(){
    let l = allItems();
    if(R.unit) l = l.filter(i => i.unit === R.unit);
    if(R.area) l = l.filter(i => (i.area || NO_AREA) === R.area);
    if(R.type) l = l.filter(i => i.type === R.type);
    const q = R.q.trim().toLowerCase(); if(q){ const w = q.split(/\s+/); l = l.filter(i => { const h = hay(i); return w.every(x => h.includes(x)); }); }
    return sortItems(l);
  }
  const repLabel = () => [R.unit ? unitLabel(R.unit) : 'All units', R.area ? (R.area === NO_AREA ? '(no area)' : R.area) : 'all areas', R.type || 'all types'].concat(R.q ? [`search “${R.q}”`] : []).join(' · ');
  function renderReports(){
    byId('view').innerHTML = `<div id="view-reports">
      <div class="card"><div class="card-h"><div><div class="card-t">Passport reports</div>
        <div class="card-m">Choose what to include, then download a formatted <b>Excel passport book</b> (summary + one sheet per system, every spec in its own column) or <b>PDF datasheets</b> with the nameplate photos. One equipment: open it and tap ⤓ PDF.</div></div></div>
        <div class="filters">
          <div class="fld"><label for="r-unit">Plant unit</label><select id="r-unit"></select></div>
          <div class="fld"><label for="r-area">Area / system</label><select id="r-area"></select></div>
          <div class="fld"><label for="r-type">Equipment type</label><select id="r-type"></select></div>
          <div class="fld"><label for="r-q">Search</label><input id="r-q" type="search" value="${esc(R.q)}" placeholder="e.g. Grundfos, Boiler #01"></div>
        </div>
        <div class="card-b tools"><button type="button" class="btn" id="r-xlsx" onclick="fpBookXlsx()">⤓ Excel passport book</button><button type="button" class="btn" id="r-pdf" onclick="fpBookPdf()">⤓ PDF datasheets</button>
          <label class="checks"><label><input type="checkbox" id="r-ph" ${R.photos ? 'checked' : ''}> with photos</label></label></div>
        <div class="f-sum" id="r-sum"></div><div class="f-sum" id="r-status" role="status"></div></div>
      <div class="card"><div class="card-h"><div class="card-t">What is in the selection</div></div><div class="list" id="r-list"></div></div></div>`;
    byId('r-unit').onchange = e => { R.unit = e.target.value; R.area = ''; R.type = ''; fillReports(); };
    byId('r-area').onchange = e => { R.area = e.target.value; R.type = ''; fillReports(); };
    byId('r-type').onchange = e => { R.type = e.target.value; fillReports(); };
    byId('r-q').oninput = e => { R.q = e.target.value; fillReports(); };
    byId('r-ph').onchange = e => { R.photos = e.target.checked; };
    fillReports();
  }
  function fillReports(){
    if(!byId('r-unit')) return;
    const all = allItems(), uc = counts(all, i => i.unit);
    byId('r-unit').innerHTML = `<option value="">All units (${all.length})</option>` + UNITS.map(u => `<option value="${u.id}">${esc(u.phase + ' · ' + u.name)} (${uc[u.id] || 0})</option>`).join(''); byId('r-unit').value = R.unit;
    const l1 = R.unit ? all.filter(i => i.unit === R.unit) : all, ac = counts(l1, i => i.area || NO_AREA);
    if(R.area && !ac[R.area]) R.area = '';
    byId('r-area').innerHTML = `<option value="">All areas (${l1.length})</option>` + Object.keys(ac).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(a => `<option value="${esc(a)}">${esc(a === NO_AREA ? '(no area given)' : a)} (${ac[a]})</option>`).join(''); byId('r-area').value = R.area;
    const l2 = R.area ? l1.filter(i => (i.area || NO_AREA) === R.area) : l1, tc = counts(l2, i => i.type);
    if(R.type && !tc[R.type]) R.type = '';
    byId('r-type').innerHTML = `<option value="">All types (${l2.length})</option>` + Object.keys(tc).sort().map(t => `<option value="${esc(t)}">${esc(t)} (${tc[t]})</option>`).join(''); byId('r-type').value = R.type;
    const list = repList();
    byId('r-sum').textContent = allLoaded() ? `${list.length} equipment in the selection · ${repLabel()}` : 'Loading the passport…';
    ['r-xlsx', 'r-pdf'].forEach(id => { byId(id).disabled = !list.length; });
    const g = counts(list, i => unitLabel(i.unit) + ' · ' + (i.area || '(no area)'));
    byId('r-list').innerHTML = Object.keys(g).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(k => `<div class="li"><div class="main"><div class="t" style="font-weight:500">${esc(k)}</div>
      <div class="s">${Object.entries(counts(list.filter(i => unitLabel(i.unit) + ' · ' + (i.area || '(no area)') === k), i => i.type)).map(([t, n]) => `${esc(t)} ${n}`).join(' · ')}</div></div><b class="mono">${g[k]}</b></div>`).join('') || '<div class="empty">Nothing matches.</div>';
  }
  const rstat = (t, c) => { const e = byId('r-status'); if(e){ e.textContent = t || ''; e.style.color = c === 'err' ? 'var(--red)' : c === 'ok' ? 'var(--green)' : ''; } };
  const sysOf = i => { const a = i.area || '(no area)'; const s = a.split(' · ')[0]; return /^fire/i.test(s) ? 'Fire fighting' : s; };
  const safeName = s => String(s || '').replace(/[^\w.-]+/g, '_').replace(/_+/g, '_').slice(0, 50);
  async function ensureLists(list){
    [...new Set(list.map(i => bucketOf(i.id)))].forEach(b => ScanKit.ensure('passport', b));
    for(let n = 0; n < 40; n++){ if(list.every(i => ScanKit.list('passport', bucketOf(i.id), i.id) !== undefined)) return; await new Promise(r => setTimeout(r, 100)); }
  }
  window.fpBookXlsx = async function(listIn, label){
    const list = listIn || repList(); label = label || repLabel();
    if(!list.length) return;
    try{
      rstat('Building the Excel book…'); await ensureLists(list);
      const gen = `Generated ${fmtStamp(nowIso())} by ${me() ? me().email : ''} · ${label} · ${list.length} equipment`;
      const groups = {}; list.forEach(i => { (groups[sysOf(i)] = groups[sysOf(i)] || []).push(i); });
      let keys = Object.keys(groups).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      if(keys.length > 24){ const small = keys.filter(k => groups[k].length < 3); if(small.length > 1){ groups['Other areas'] = small.flatMap(k => groups[k]); small.forEach(k => delete groups[k]); keys = Object.keys(groups).sort(); } }
      const byArea = {}; list.forEach(i => { const k = i.unit + '|' + (i.area || '(no area)'); (byArea[k] = byArea[k] || []).push(i); });
      const sum = [[{ v: 'ITC Haridwar — Factory Passport · equipment book', s: 'title' }], [{ v: gen, s: 'sub' }], [],
        ['Unit', 'Area / system', 'Equipment', 'Types', 'Sheet'].map(h => ({ v: h, s: 'hdr' }))];
      Object.keys(byArea).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).forEach(k => { const l = byArea[k], [u, a] = k.split('|');
        sum.push([{ v: unitLabel(u), s: 'cell' }, { v: a, s: 'cell' }, { v: l.length, s: 'num' }, { v: Object.entries(counts(l, i => i.type)).map(([t, n]) => `${t} ${n}`).join(' · '), s: 'wrap' }, { v: keys.find(g => groups[g].includes(l[0])) || '', s: 'cell' }]); });
      sum.push([{ v: 'Total', s: 'label' }, { v: '', s: 'label' }, { v: list.length, s: 'label' }, { v: '', s: 'label' }, { v: '', s: 'label' }]);
      const warn = list.filter(i => (i.specs || []).some(s => /^⚠/.test(s.k)));
      if(warn.length){ sum.push([], [{ v: '⚠ Values to confirm (the source sheets disagree)', s: 'section' }]);
        warn.forEach(i => (i.specs || []).filter(s => /^⚠/.test(s.k)).forEach(s => sum.push([{ v: i.name, s: 'cell' }, { v: s.k.replace(/^⚠\s*/, ''), s: 'cell' }, { v: s.v, s: 'late' }]))); }
      const sheets = [{ name: 'Summary', title: 'Factory Passport', cols: [16, 40, 11, 60, 18], rows: sum, merges: ['A1:E1', 'A2:E2'], freeze: { r: 4, c: 0 }, heights: { 0: 24 }, tab: '065F46', portrait: true }];
      keys.forEach(g => {
        const l = groups[g], sk = specOrder(l);
        const H = ['Unit', 'Area', 'Type', 'Equipment', 'Make', 'Model', 'Serial no.', 'Year', 'Status'].concat(sk, ['Notes', 'Documents', 'Source', 'Passport ID']);
        const rows = [[{ v: `${g} — ${l.length} equipment`, s: 'title' }], [{ v: gen, s: 'sub' }], H.map((h, n) => ({ v: h.replace(/^⚠\s*/, '⚠ '), s: n >= 9 && n < 9 + sk.length ? 'hdrInput' : 'hdr' }))];
        l.forEach(i => { const m = {}; (i.specs || []).forEach(s => { m[s.k] = s.v; }); const fl = ScanKit.list('passport', bucketOf(i.id), i.id);
          rows.push([unitLabel(i.unit), i.area, i.type, i.name, i.make, i.model, i.serial, i.year, i.status || 'In service'].map((v, n) => ({ v: v || '', s: n === 3 ? 'label' : 'cell' }))
            .concat(sk.map(k => ({ v: m[k] == null ? '' : (/^-?\d+(\.\d+)?$/.test(String(m[k]).trim()) ? +m[k] : m[k]), s: /^⚠/.test(k) && m[k] ? 'late' : 'cell' })),
                    [{ v: i.notes || '', s: 'wrap' }, { v: fl && fl.length ? fl.length : '', s: 'num' }, { v: i.ref || '', s: 'cell' }, { v: i.id, s: 'grey' }])); });
        const last = PMX.colName(H.length - 1);
        sheets.push({ name: g, cols: [12, 26, 16, 32, 18, 20, 18, 7, 11].concat(sk.map(k => Math.min(24, Math.max(11, k.length + 2))), [34, 10, 34, 16]), rows,
          merges: [`A1:${last}1`, `A2:${last}2`], freeze: { r: 3, c: 4 }, filter: `A3:${last}${rows.length}`, printTitle: 3, heights: { 0: 22, 2: 32 } });
      });
      const name = `Factory_Passport_Book_${safeName(R.area || (R.unit ? unitLabel(R.unit) : 'All'))}_${todayIso()}.xlsx`;
      PMX.save(name, PMX.xlsx(sheets), PMX.XLSX_MIME);
      rstat(`✓ ${name} · ${keys.length + 1} sheets · ${list.length} equipment`, 'ok');
    }catch(e){ console.error(e); rstat('Excel failed: ' + (e.message || e), 'err'); }
  };
  async function fileB64(x){
    const f = window.__pmScanFs, db = fb().db, parts = x.parts || 1;
    const snaps = await Promise.all(Array.from({ length: parts }, (_, k) => f.getDoc(f.doc(db, 'itc_pm', `scandata_${x.id}_${k}`))));
    return snaps.map(s => (s.exists() ? (s.data() || {}).d : '') || '').join('');
  }
  window.fpPdfOne = function(id){ const i = P.items[id]; if(!i) return; fpBookPdf([i], i.name, true); };
  window.fpBookPdf = async function(listIn, label, photos){
    const list = listIn || repList(); label = label || repLabel(); if(!list.length) return;
    const withPhotos = photos != null ? photos : !!(byId('r-ph') && byId('r-ph').checked);
    const btn = byId('r-pdf'); if(btn) btn.disabled = true;
    const say = t => { rstat(t); if(listIn && listIn.length === 1) toast('PDF', t); };
    try{
      if(listIn && listIn.length === 1) toast('Building the PDF…', list[0].name);
      else rstat('Building the PDF…');
      const files = {};
      for(const i of list){ files[i.id] = await listed(bucketOf(i.id), i.id); }
      const D = PMX.pdf(); D.info.title = 'Factory Passport — ' + label;
      const M = 34, W = D.W - 2 * M, BOT = D.H - 44; let y = 0;
      const gen = `Generated ${fmtStamp(nowIso())}${me() ? ' · ' + me().email : ''}`;
      const head = () => { D.rect(0, 0, D.W, 44, { fill: '064E3B' }); D.text('ITC Haridwar — Factory Passport', M, 27, { size: 13, bold: true, color: 'FFFFFF' }); D.text(gen, D.W - M, 27, { size: 7.5, color: 'C7F0DD', align: 'right' }); y = 62; };
      const page = () => { D.newPage(); head(); };
      const need = h => { if(y + h > BOT){ page(); return true; } return false; };
      head();
      if(list.length > 1){
        D.text(label, M, y + 6, { size: 14, bold: true, maxW: W }); y += 16;
        D.text(`${list.length} equipment`, M, y + 6, { size: 9, color: '667085' }); y += 18;
        const cw = [22, 170, 82, 110, 70, W - 454];
        const hdr = () => { need(18); D.rect(M, y, W, 15, { fill: '065F46' }); let x = M; ['#', 'Equipment', 'Type', 'Area', 'Make', 'Model / serial'].forEach((h, n) => { D.text(h, x + 4, y + 10.5, { size: 7.5, bold: true, color: 'FFFFFF', maxW: cw[n] - 6 }); x += cw[n]; }); y += 15; };
        hdr();
        list.forEach((i, n) => { if(y + 14 > BOT){ page(); hdr(); } if(n % 2) D.rect(M, y, W, 14, { fill: 'F3F7F5' }); let x = M;
          [String(n + 1), i.name, i.type, i.area || '', i.make || '', [i.model, i.serial].filter(Boolean).join(' · ')].forEach((t, k) => { D.text(t, x + 4, y + 10, { size: 7.5, bold: k === 1, maxW: cw[k] - 6 }); x += cw[k]; }); y += 14; });
        y += 10;
      }
      let ph = 0;
      for(const i of list){
        if(list.length > 1) need(150);
        D.rect(M, y, W, 40, { fill: 'ECFDF5', stroke: 'A7F3D0' });
        D.text(String(i.type || '').toUpperCase(), M + 8, y + 12, { size: 7, bold: true, color: '047857' });
        D.text(i.name, M + 8, y + 28, { size: 13, bold: true, maxW: W - 140 });
        D.text(i.status || 'In service', M + W - 8, y + 12, { size: 8, bold: true, color: i.status && i.status !== 'In service' ? 'B54708' : '047857', align: 'right' });
        D.text(`${unitLabel(i.unit)}${i.area ? ' · ' + i.area : ''}`, M + W - 8, y + 28, { size: 8, color: '475467', align: 'right', maxW: 200 });
        y += 48;
        const facts = [['Make', i.make], ['Model', i.model], ['Serial no.', i.serial], ['Tag', i.tag], ['Year installed', i.year]].filter(f => f[1]);
        const specs = (i.specs || []).filter(s => s.v !== '' && s.v != null).map(s => [s.k, s.v]);
        const pairs = facts.concat(specs), colW = W / 2;
        for(let k = 0; k < pairs.length; k += 2){
          const L1 = D.wrap(pairs[k][1], colW - 132, 8.3), L2 = pairs[k + 1] ? D.wrap(pairs[k + 1][1], colW - 132, 8.3) : [];
          const h = Math.max(L1.length, L2.length, 1) * 10 + 5; need(h);
          [pairs[k], pairs[k + 1]].forEach((p, j) => { if(!p) return; const x = M + j * colW, wv = /^⚠/.test(p[0]);
            D.text(p[0].replace(/^⚠\s*/, '! '), x + 4, y + 9, { size: 7.6, bold: true, color: wv ? 'B42318' : '475467', maxW: 124 });
            (j ? L2 : L1).forEach((ln, q) => D.text(ln, x + 128, y + 9 + q * 10, { size: 8.3, color: wv ? 'B42318' : '101828' })); });
          D.line(M, y + h, M + W, y + h, { color: 'E5E7EB', lw: 0.4 }); y += h;
        }
        if(!pairs.length){ need(14); D.text('No specifications recorded yet.', M + 4, y + 10, { size: 8.3, color: '667085' }); y += 14; }
        if(i.notes){ const L = D.wrap('Notes: ' + i.notes, W - 8, 8.3); need(L.length * 10.5 + 6); L.forEach((ln, q) => D.text(ln, M + 4, y + 11 + q * 10.5, { size: 8.3, color: '344054' })); y += L.length * 10.5 + 6; }
        const fl = files[i.id] || [], imgs = fl.filter(f => f.kind === 'image' || /^image\//.test(f.type || '')), docs = fl.filter(f => imgs.indexOf(f) < 0);
        if(docs.length){ const L = D.wrap('Documents: ' + docs.map(d => d.name).join(' · '), W - 8, 8); need(L.length * 10 + 4); L.forEach((ln, q) => D.text(ln, M + 4, y + 10 + q * 10, { size: 8, color: '667085' })); y += L.length * 10 + 4; }
        if(withPhotos && imgs.length){
          const bw = (W - 10) / 2, bh = 200; let col = 0;
          for(const f of imgs.slice(0, 4)){
            say(`Building the PDF… photo ${++ph}`);
            let im = null; try{ const j = await PMX.jpeg(await fileB64(f), f.type || 'image/jpeg', 1200); im = D.addJpeg(j.bytes, j.w, j.h); im._w = j.w; im._h = j.h; }catch(e){ console.warn('[passport pdf photo]', e); }
            if(col === 0) need(bh + 20);
            const x = M + col * (bw + 10);
            if(im){ const k = Math.min(bw / im._w, bh / im._h), w = im._w * k, h = im._h * k; D.rect(x, y + 4, bw, bh, { stroke: 'D0D5DD' }); D.image(im, x + (bw - w) / 2, y + 4 + (bh - h) / 2, w, h); }
            else { D.rect(x, y + 4, bw, bh, { fill: 'F7F8FA', stroke: 'D0D5DD' }); D.text('Photo could not be loaded', x + bw / 2, y + 4 + bh / 2, { size: 8, color: '667085', align: 'center' }); }
            D.text(f.name, x + 2, y + bh + 14, { size: 7.2, color: '667085', maxW: bw - 4 });
            col++; if(col === 2){ col = 0; y += bh + 20; }
          }
          if(col) y += bh + 20;
        }
        if(i.ref){ need(12); D.text('Source: ' + i.ref, M + 4, y + 9, { size: 7, color: '98A2B3', maxW: W - 8 }); y += 12; }
        y += 14;
      }
      const N = D.pages.length;
      D.pages.forEach((pg, n) => { D.cur = pg; D.line(M, D.H - 30, D.W - M, D.H - 30, { color: 'D0D5DD', lw: 0.5 }); D.text('ITC Haridwar · COT PM module · Factory Passport', M, D.H - 18, { size: 7, color: '98A2B3' }); D.text(`Page ${n + 1} of ${N}`, D.W - M, D.H - 18, { size: 7.5, color: '667085', align: 'right' }); });
      const name = `Factory_Passport_${safeName(list.length === 1 ? list[0].name : (R.area || (R.unit ? unitLabel(R.unit) : 'All')))}_${todayIso()}.pdf`;
      PMX.save(name, D.output(), 'application/pdf');
      say(`✓ ${name} · ${N} page${N === 1 ? '' : 's'}${ph ? ` · ${ph} photo${ph === 1 ? '' : 's'}` : ''}`); rstat(`✓ ${name} · ${N} page${N === 1 ? '' : 's'}`, 'ok');
    }catch(e){ console.error(e); rstat('PDF failed: ' + (e.message || e), 'err'); toast('PDF failed', e.message || String(e), 'error'); }
    finally{ if(btn) btn.disabled = false; }
  };
  window.__passportBuild = '3.14 · 01-10-2026';
  if(P.view !== 'find') renderView();
  binCount();
})();
</script>
